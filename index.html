<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Cycle 8 — Force auto-régulée</title>

<!-- PWA / écran d'accueil iOS -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cycle 8">
<meta name="application-name" content="Cycle 8">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  :root{
    --bg:#0b0d12; --panel:#151922; --panel2:#1d2330; --line:#2a313f;
    --ink:#eef1f6; --dim:#8b93a3; --dimmer:#565d6e;
    --acc:#e8583a; --gold:#f0a83a; --ok:#4ec98a; --steel:#5b8def; --warn:#e8c34a;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.4;overscroll-behavior-y:none}
  body{padding-bottom:100px}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.02em}
  .wrap{max-width:660px;margin:0 auto;padding:0 14px}
  header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0b0d12 72%,rgba(11,13,18,0));padding:16px 0 8px}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:0 14px}
  .brand .mark{font-size:24px;font-weight:900;letter-spacing:-0.04em}
  .brand .mark b{color:var(--acc)}
  .brand .cyc{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:0.12em;text-align:right}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
  .card h2{font-size:19px;margin-bottom:4px}
  .muted{color:var(--dim);font-size:14px}
  .tiny{color:var(--dimmer);font-size:12px}
  label{display:block;font-size:13px;color:var(--dim);font-weight:600;margin:0 0 5px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px;font-size:16px;font-weight:600}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--acc);color:#fff;
    border:none;border-radius:11px;padding:14px 18px;font-size:15px;font-weight:800;width:100%}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:9px 12px;font-size:13px}
  .row{display:flex;gap:10px;align-items:center}
  /* week strip */
  .weeks{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:0 0 auto;min-width:44px;text-align:center;padding:8px 6px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--line)}
  .wk .n{font-weight:900;font-size:16px}
  .wk .p{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.06em;font-weight:700}
  .wk.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .wk.on .p{color:rgba(255,255,255,0.85)}
  .wk.deload.on{background:var(--steel);border-color:var(--steel)}
  .wk.done{opacity:0.5}
  /* day strip */
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin-top:6px}
  .days::-webkit-scrollbar{display:none}
  .daybtn{flex:0 0 auto;padding:10px 14px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--dim)}
  .daybtn.on{background:var(--steel);color:#fff;border-color:var(--steel)}
  .daybtn.ok{border-color:var(--ok)}
  /* exercise */
  .ex{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
  .ex .top{padding:12px 14px;background:var(--panel2)}
  .namerow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .btnrow{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
  .vid{background:rgba(91,141,239,0.12);border:1px solid rgba(91,141,239,0.4);color:var(--steel);
    font-size:11px;font-weight:700;border-radius:8px;padding:5px 10px;white-space:nowrap}
  .vid:active{background:rgba(91,141,239,0.25)}
  .ex .name{font-weight:800;font-size:15px}
  .swap{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);
    font-size:11px;font-weight:700;border-radius:8px;padding:5px 9px;white-space:nowrap}
  .swap:active{background:var(--panel)}
  .swap.alt{border-color:rgba(232,88,58,0.4);color:var(--acc)}
  .swaprow{display:flex;gap:6px}
  .swapwrap{margin-top:8px}
  .picker{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
  .pklabel{font-size:12px;color:var(--dim);margin-bottom:8px}
  .pklabel b{color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:700;
    border-radius:999px;padding:7px 12px}
  .chip.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .ex .meta{font-size:12px;color:var(--dim);margin-top:2px}
  .ex .cue{font-size:11px;color:var(--gold);margin-top:3px;font-weight:600}
  .ex .tech{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.35;background:var(--panel2);border-left:3px solid var(--steel);padding:8px 10px;border-radius:0 8px 8px 0}
  .setrow{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center;
    padding:8px 14px;border-top:1px solid var(--line)}
  .setrow.main{grid-template-columns:38px 1fr 1fr 1fr 44px}
  .setrow .si{font-weight:800;color:var(--dim);font-size:13px;text-align:center;line-height:1.1}
  .setrow input{padding:9px;text-align:center;font-size:15px}
  .setrow input.rpein{border-color:rgba(240,168,58,0.4);background:rgba(240,168,58,0.06)}
  .rowhead{display:grid;grid-template-columns:38px 1fr 1fr 1fr 44px;gap:8px;padding:6px 14px 2px;
    font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;text-align:center}
  .rowhead span:first-child{text-align:left}
  .wuhead{padding:8px 14px 2px;font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:0.06em}
  .setrow.wu{grid-template-columns:38px 1fr 1fr;opacity:0.85}
  .setrow.wu .wuw{font-weight:700;font-size:14px}
  .setrow.wu .wur{font-size:13px;color:var(--dim)}
  .wusep{padding:8px 14px 2px;font-size:11px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:0.06em;border-top:1px dashed var(--line);margin-top:4px}
  .chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--dimmer)}
  .chk.done{background:var(--ok);border-color:var(--ok);color:#08130c}
  /* rpe */
  .rpe{padding:10px 14px;border-top:1px solid var(--line);background:rgba(240,168,58,0.05)}
  .rpe .q{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:7px}
  .rpebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .rb{padding:9px 4px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
    font-size:11px;font-weight:700;color:var(--dim);text-align:center;line-height:1.15}
  .rb.on{background:var(--gold);border-color:var(--gold);color:#1a1205}
  .rb b{display:block;font-size:14px}
  /* rest bar */
  .rest{position:fixed;left:0;right:0;bottom:78px;z-index:45;display:none;padding:0 14px}
  .rest .inner{max-width:660px;margin:0 auto;background:var(--acc);color:#fff;border-radius:14px;
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
  .rest.show{display:block}
  .rest .t{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
  .rest .lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;opacity:0.85;font-weight:700}
  .rest button{background:rgba(255,255,255,0.2);border:none;color:#fff;font-weight:800;border-radius:9px;padding:8px 12px;font-size:13px;margin-left:8px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(11,13,18,0.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
  nav button{background:none;border:none;color:var(--dimmer);font-size:10px;font-weight:700;display:flex;
    flex-direction:column;align-items:center;gap:3px;flex:1;text-transform:uppercase;letter-spacing:0.05em}
  nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
  nav button.on{color:var(--acc)}
  .hide{display:none!important}
  .note{background:var(--panel2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--dim);margin:10px 0}
  .note.blue{border-color:var(--steel)}
  .miss{background:rgba(232,195,74,0.08);border:1px solid rgba(232,195,74,0.3);border-radius:12px;padding:13px 14px;margin:10px 0}
  .misshead{font-weight:800;font-size:14px;color:var(--warn);margin-bottom:3px}
  .misstxt{font-size:13px;color:var(--dim);margin-bottom:10px}
  .missrow{display:flex;gap:8px}
  .missrow .btn{width:auto;flex:1}
  .nextrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .nextrow:first-of-type{border-top:none}
  .nextsel{flex:1}
  .nextsel select{padding:9px 10px;font-size:14px}
  .nextrow .r{flex:0 0 auto;color:var(--dim);font-size:13px}
  .adj{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px}
  .adj.up{background:rgba(78,201,138,0.15);color:var(--ok)}
  .adj.down{background:rgba(232,88,58,0.15);color:var(--acc)}
  .adj.same{background:rgba(139,147,163,0.15);color:var(--dim)}
  .pr{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .pr .n{font-size:24px;font-weight:900;letter-spacing:-0.03em}
  .pr .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.1em;font-weight:700}
  .empty{text-align:center;color:var(--dimmer);padding:30px 10px;font-size:14px}
  .exline{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .exline:first-child{border-top:none}
  .exline .r{color:var(--dim);font-size:13px;flex:0 0 auto;margin-left:10px}
  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ok);color:#08130c;
    padding:11px 18px;border-radius:999px;font-weight:800;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:88%}
  .toast.show{opacity:1}
  .bar{height:7px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:999px}
  /* accessoires : mouvements multiples (superset), poids du corps, gainage chrono */
  .setrow.acc{grid-template-columns:30px 1fr 44px;align-items:center}
  .movwrap{display:flex;flex-direction:column;gap:10px}
  .movline{display:flex;flex-direction:column;gap:5px}
  .movline + .movline{border-top:1px dashed var(--line);padding-top:9px}
  .movname{font-size:12px;color:var(--dim);font-weight:700}
  .movin{display:flex;gap:8px;align-items:center}
  .movin input{padding:9px;text-align:center;font-size:15px;width:100%}
  .diffs{display:flex;gap:5px;flex:0 0 auto}
  .df{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:700;border-radius:8px;padding:9px 10px;white-space:nowrap}
  .df.on{background:var(--gold);border-color:var(--gold);color:#1a1205}
  .typebtn{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:700;border-radius:8px;padding:5px 9px;white-space:nowrap}
  .typebtn.set{border-color:rgba(240,168,58,0.5);color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">CYCLE<b>8</b></div>
    <div class="cyc" id="cycInfo">Semaine 1 / 8</div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="rest" id="rest">
  <div class="inner">
    <div><div class="lbl">Repos</div><div class="t" id="restT">3:00</div></div>
    <div class="row"><button onclick="restAdd(30)">+30s</button><button onclick="restStop()">Passer</button></div>
  </div>
</div>

<nav>
  <button data-nav="today" class="on" onclick="go('today')">
    <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="5"/></svg>Séance</button>
  <button data-nav="cycle" onclick="go('cycle')">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>Cycle</button>
  <button data-nav="next" onclick="go('next')">
    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Suivant</button>
  <button data-nav="prs" onclick="go('prs')">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Records</button>
  <button data-nav="history" onclick="go('history')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Journal</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ================= STORAGE ================= */
/* Mode essai : quand TESTMODE est actif, toutes les clés sont préfixées "test:"
   -> données de test séparées, le vrai programme reste intact. La clé "testmode"
   elle-même n'est jamais préfixée (elle mémorise le mode). */
let TESTMODE=false;
const store={
  nk(k){ return (TESTMODE && k!=='testmode') ? 'test:'+k : k; },
  async get(k){k=this.nk(k);try{if(window.storage){const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}}catch(e){}
    try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
  async set(k,v){k=this.nk(k);const s=JSON.stringify(v);try{if(window.storage){await window.storage.set(k,s);}}catch(e){}
    try{localStorage.setItem(k,s);}catch(e){}}
};

/* ================= MODÈLE ================= */
/* Programme unique : 4 jours, 8 semaines, auto-régulé au RPE.
   Structure Upper/Lower (haut/bas) x2 — le format le plus étayé pour 4j/sem intermédiaire.
   Chaque gros lift porte un RPE cible. On stocke une "charge de travail" par lift,
   qui évolue selon le ressenti saisi à la séance précédente. */

const RPE_TARGET_BY_WEEK = [7,7.5,8,8.5,7.5,8,8.5,6]; // sem1..8 ; sem8 = deload
const DELOAD_WEEK = 8;

// exercices principaux (auto-régulés) : clé = lift des records
// topPct = point de départ de la charge de travail au 1er passage (calé sur % du 1RM au RPE cible sem1)
const MAIN = {
  squat:    {label:"Squat",              startPct:0.72},
  bench:    {label:"Développé couché",   startPct:0.72},
  deadlift: {label:"Soulevé de terre",   startPct:0.72},
  ohp:      {label:"Développé militaire",startPct:0.68, from:"bench", fromRatio:0.62}
};

// 4 séances. Chaque séance = liste d'exos.
// main:true => série de travail auto-régulée (utilise la charge courante du lift + RPE cible)
// mainSets/mainReps par séance ; accessoires en reps fixes.
/* Chaque exo accessoire = un "slot" avec plusieurs variantes équivalentes (même fonction).
   La variante utilisée dépend du numéro de cycle (rotation) → change à chaque nouveau cycle,
   sans toucher aux gros mouvements. Bouton "non faisable" = passer à la variante suivante.
   alt:[...] liste les variantes ; needs = matériel requis (pour info). */
const DAYS = [
  {name:"Bas A (Squat)", ex:[
    {lift:"squat", main:true, name:"Squat", sets:4, reps:"5", targetReps:5, rest:180, cue:"Note reps + RPE à chaque série : la charge de la série suivante s'adapte."},
    {slot:"hinge", sets:3, reps:"8", rest:120, alt:["Soulevé de terre roumain","Good morning","Rack pull","Hyperextension lestée","Deadlift jambes tendues","Soulevé de terre déficit","Snatch-grip deadlift","Soulevé de terre pause sous genou"]},
    {slot:"quad", sets:3, reps:"10-12", rest:90, alt:["Presse à cuisses","Hack squat","Leg extension","Squat gobelet","Belt squat","Leg press unilatéral","Presse à cuisses pieds bas"]},
    {slot:"ham", sets:3, reps:"12", rest:75, alt:["Leg curl allongé","Leg curl assis","Nordic curl","Leg curl unilatéral","Leg curl debout","Razor curl","Glute-ham raise"]},
    {superset:true, slot:"abs", sets:3, reps:"12 + 12", rest:60, alt:[
      "Relevé de jambes suspendu + extensions lombaires",
      "Crunch à la poulie + superman",
      "Roue abdominale + good morning léger",
      "V-ups + hip extensions",
      "Relevé de genoux + bird dog",
      "Crunch décliné + hyperextension",
      "Dragon flag + superman",
      "Crunch machine + planche",
      "Toes-to-bar + back extension"]},
  ]},
  {name:"Haut A (Couché)", ex:[
    {lift:"bench", main:true, name:"Développé couché", sets:4, reps:"5", targetReps:5, rest:180, cue:"Reps + RPE à chaque série."},
    {lift:"ohp", main:true, name:"Développé militaire", sets:3, reps:"6", targetReps:6, rest:150, cue:"Reps + RPE à chaque série."},
    {slot:"vpull", sets:4, reps:"6-8", rest:120, alt:["Tractions lestées","Tirage vertical prise large","Tractions supination","Tirage vertical prise neutre","Tractions prise serrée","Tirage vertical unilatéral","Pull-up assisté lesté","Tirage vertical machine","Pull-up prise large","Tirage vertical corde","Tractions prise neutre lestées"]},
    {slot:"hpull", sets:3, reps:"10-12", rest:90, alt:["Tirage horizontal poulie","Rowing haltère","Rowing T-bar","Tirage poitrine machine","Chest-supported row","Rowing bas poulie unilatéral","Rowing élastique","Tirage horizontal machine"]},
    {slot:"arms", sets:3, reps:"12", rest:75, alt:["Triceps + biceps (superset)","Barre au front + curl barre","Extensions poulie + curl marteau","Dips + curl incliné","Triceps overhead + curl poulie","Kickback + curl concentré","Extensions haltère + curl pupitre","Triceps machine + curl machine","Extensions corde + curl haltères","Dips lestés + curl araignée"]},
    {superset:true, slot:"abs", sets:3, reps:"12 + 30s", rest:60, alt:[
      "Crunch à la poulie + Pallof press",
      "Relevé de jambes + gainage",
      "Roue abdominale + planche latérale",
      "Russian twists + hollow hold",
      "Crunch câble + gainage latéral dynamique",
      "Woodchopper poulie + dead bug",
      "V-ups + planche",
      "Crunch machine + Pallof press",
      "Hanging knee raise + hollow hold"]},
  ]},
  {name:"Bas B (Terre)", ex:[
    {lift:"deadlift", main:true, name:"Soulevé de terre", sets:4, reps:"4", targetReps:4, rest:210, cue:"Reps + RPE à chaque série."},
    {slot:"squatvar", sets:3, reps:"8", rest:120, alt:["Squat avant","Squat aux épingles","Squat pause 3 s","Box squat","Zercher squat","Squat au Smith","Front squat haltères","Squat tempo 3-0-3"]},
    {slot:"unilat", sets:3, reps:"10 / jambe", rest:90, alt:["Fentes marchées","Fentes arrière","Step-up sur banc","Split squat bulgare","Fentes avant lestées","Step-up latéral","Lunge au Smith","Fentes bulgares déficit"]},
    {slot:"glute", sets:3, reps:"10-12", rest:90, alt:["Cable pull-through","Kickback poulie","Abduction à la hanche","Kickback machine","Abduction à la poulie","Pull-through élastique","Kickback élastique","Extension de hanche à la poulie"]},
  ]},

// ~4% de charge par point de RPE ; ajusté aussi selon reps réelles vs cible
function suggestNextLoad(curW, targetRPE, actualRPE, targetReps, actualReps){
  if(actualRPE==null) return curW;
  // écart RPE : positif = trop facile (RPE réel < cible) => monter
  let rpeGap = targetRPE - actualRPE;
  // écart reps : positif = plus de reps que prévu => monter
  let repGap = (actualReps!=null ? actualReps - targetReps : 0);
  // ZONE DE TOLÉRANCE (anti-fatigue) : un écart de RPE de 1 ou moins, avec des reps
  // proches de la cible, n'est PAS significatif → on garde la même charge. On ne
  // réagit qu'à un écart net (>1 RPE) ou à un vrai décalage de reps.
  if(Math.abs(rpeGap) <= 1 && Math.abs(repGap) <= 1) return curW;
  // conversion : chaque point de RPE ≈ 3% ; chaque rep d'écart ≈ 3%
  let pct = (rpeGap*0.03) + (repGap*0.03);
  // borne raisonnable par série : ±7%
  pct = Math.max(-0.07, Math.min(0.07, pct));
  let next = curW*(1+pct);
  return Math.round(next/2.5)*2.5;
}

const roundW=w=>Math.round(w/2.5)*2.5;
function fmtT(s){const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,'0');}

/* ===== Type de mouvement : 'weight' (poids+reps), 'body' (reps, sans poids), 'hold' (gainage : temps+difficulté) =====
   Classification automatique d'après le nom + le format des reps ("30s" = tenue chronométrée).
   Corrigeable à la main via un bouton (CYCLE.kindOverride[clé] force le type de tout l'exo). */
const HOLD_RE=/gainage|planche|hollow|wall ?sit|pallof|copenhagen|superman|dead ?bug|side plank|bird dog|\bhold\b/i;
const BODY_RE=/crunch|relev|roue|ab ?wheel|v-?up|russian|toes|knee raise|mountain|nordic|pistol|pompe|dragon|hanging|clamshell|monster|fire hydrant/i;
const EQUIP_RE=/poulie|c[aâ]ble|cable|machine|lest|halt[eè]re|barre|kettlebell|smith|\bez\b|hip thrust|presse|hack|curl|d[ée]velopp|rowing|tirage|traction|dips|swing|goblet|gobelet/i;
function autoKind(name, repTok){
  const n=name||'', t=String(repTok||'').trim();
  if(/\d\s*s$/i.test(t) || HOLD_RE.test(n)) return 'hold';
  if(BODY_RE.test(n) && !EQUIP_RE.test(n)) return 'body';
  return 'weight';
}
function holdSecs(repTok){ const m=String(repTok||'').match(/(\d+)\s*s/i); return m?parseInt(m[1]):null; }
function kindLabel(k){ return k==='weight'?'avec poids':k==='body'?'poids du corps':k==='hold'?'gainage':'auto'; }
// mouvements d'un exo (1, ou 2 pour un superset "A + B") avec leur type
function exMovements(ex, di, dispName, key){
  const parts=String(dispName).replace(/\(superset\)/ig,'').split('+').map(x=>x.trim()).filter(Boolean);
  const reps=String(ex.reps||'').split('+').map(x=>x.trim());
  const ov=(CYCLE&&CYCLE.kindOverride)?CYCLE.kindOverride[key]:null;
  return (parts.length?parts:[String(dispName)]).map((nm,i)=>{
    const rt=reps[i]||reps[0]||ex.reps||'';
    return { name:nm, repTok:rt, kind: ov || autoKind(nm, rt) };
  });
}
function cycleKind(di, key){
  if(!CYCLE.kindOverride) CYCLE.kindOverride={};
  const order=[null,'weight','body','hold'];
  const cur=CYCLE.kindOverride[key]||null;
  const nx=order[(order.indexOf(cur)+1)%order.length];
  if(nx===null) delete CYCLE.kindOverride[key]; else CYCLE.kindOverride[key]=nx;
  store.set('cycle',CYCLE);
  toast('Type : '+kindLabel(nx));
  render();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}

function initCycle(prevCycleNum, carryNextOverride){
  const loads={};
  for(const k in MAIN){
    const m=MAIN[k];
    const base = m.from ? PR[m.from]*m.fromRatio : PR[k];
    loads[k]=roundW(base*m.startPct);
  }
  const num = (prevCycleNum||0)+1;
  // les choix "cycle suivant" prévisualisés deviennent les overrides actifs du nouveau cycle
  const slotOverride = carryNextOverride ? {...carryNextOverride} : {};
  return {start:new Date().toISOString(), num, week:1, dayDone:{}, loads, lastAdj:{}, slotOverride, nextOverride:{}, history:[]};
}

// clé unique par jour+slot (un même slot, ex "abs", existe dans plusieurs jours)
function slotKey(di, slot){ return di+':'+slot; }

// Vérifie qu'une session sauvegardée correspond encore à la structure du programme actuel.
// (Si on a changé les exercices/séries depuis, l'ancienne session est incompatible.)
function sessionValid(ses){
  if(!ses || typeof ses.day!=='number' || !Array.isArray(ses.ex)) return false;
  const day=DAYS[ses.day];
  if(!day) return false;
  if(ses.ex.length!==day.ex.length) return false;
  for(let i=0;i<day.ex.length;i++){
    const need=day.ex[i].sets;
    if(!ses.ex[i] || !Array.isArray(ses.ex[i].sets) || ses.ex[i].sets.length!==need) return false;
  }
  return true;
}

/* Résout le nom d'un accessoire. mode:'cur' = cycle en cours ; mode:'next' = cycle suivant (prévisualisation).
   di = index du jour. Renvoie {name, idx, count, list}. */
function resolveExo(ex, di, mode){
  if(!ex.slot) return {name:ex.name, idx:0, count:1, list:[ex.name]};
  const list=ex.alt||[ex.name];
  const cyc=(CYCLE&&CYCLE.num)?CYCLE.num:1;
  const key=slotKey(di, ex.slot);
  if(mode==='next'){
    const base=(cyc)%list.length;  // rotation auto du prochain cycle
    const ov=CYCLE&&CYCLE.nextOverride?CYCLE.nextOverride[key]:undefined;
    let idx=(ov!=null)?ov:base;
    idx=((idx%list.length)+list.length)%list.length;
    return {name:list[idx], idx, count:list.length, list};
  }
  const base=(cyc-1)%list.length;
  // nom personnalisé fixé via "tout le cycle" (choix par matériel) : prioritaire
  const custom=CYCLE&&CYCLE.slotCustom?CYCLE.slotCustom[key]:undefined;
  if(custom){ return {name:custom, idx:-1, count:list.length, list, custom:true}; }
  const ov=CYCLE&&CYCLE.slotOverride?CYCLE.slotOverride[key]:undefined;
  let idx=(ov!=null)?ov:base;
  idx=((idx%list.length)+list.length)%list.length;
  return {name:list[idx], idx, count:list.length, list};
}
// matériel réellement utile pour un muscle donné (n'affiche que ce qui sert à au moins un exo)
function relevantEquip(slot){
  const muscle=SLOT_MUSCLE[slot];
  const bank=EX_BANK[muscle]||[];
  const set=new Set();
  bank.forEach(x=>x.eq.forEach(q=>set.add(q)));
  // conserve l'ordre de EQUIP
  return Object.keys(EQUIP).filter(id=>set.has(id));
}
function toggleEquip(id){
  if(!CYCLE.equip) CYCLE.equip={};
  CYCLE.equip[id]=!CYCLE.equip[id];
  store.set('cycle',CYCLE);
  render();
}
function availableEquip(){
  const e=(CYCLE&&CYCLE.equip)||{};
  return Object.keys(EQUIP).filter(k=>e[k]);
}

// Ouvre le sélecteur de matériel. mode:'session' (juste aujourd'hui) ou 'cycle' (toute la suite).
let equipPicker=null; // {slot, mode}
function openEquipPicker(slot, mode){
  if(equipPicker && equipPicker.slot===slot && equipPicker.mode===mode){ equipPicker=null; }
  else { equipPicker={slot, mode}; }
  render();
}
// "non faisable ce cycle" : on garde une version rotation simple en secours (non utilisée par l'UI)
function swapExo(di, slot){
  if(!CYCLE)return;
  const ex=DAYS[di].ex.find(e=>e.slot===slot);
  if(!ex)return;
  const cur=resolveExo(ex, di, 'cur');
  const next=(cur.idx+1)%cur.count;
  CYCLE.slotOverride[slotKey(di,slot)]=next;
  if(SESSION && SESSION.day===di){
    const se=SESSION.ex.find(e=>e.slot===slot);
    if(se){ se.name=cur.list[next]; se.sessOverride=next; }
    store.set('session',SESSION);
  }
  store.set('cycle',CYCLE);
  toast("Changé pour tout le cycle : "+cur.list[next]);
  render();
}

// choisit un exo du bon muscle réalisable avec le matériel coché, selon le mode
function chooseByEquip(di, slot, mode){
  const ex=DAYS[di].ex.find(e=>e.slot===slot);
  if(!ex)return;
  const muscle=SLOT_MUSCLE[slot];
  const bank=EX_BANK[muscle]||[];
  const avail=availableEquip();
  if(!avail.length){ toast("Coche au moins un matériel"); return; }
  const doable=bank.filter(x=> x.eq.some(q=>avail.includes(q)) );
  if(!doable.length){ toast("Aucun exo pour ce muscle avec ce matériel"); return; }

  if(mode==='cycle'){
    // remplace pour toute la suite du cycle : on stocke le nom choisi comme override "custom"
    const curName = resolveExo(ex, di, 'cur').name;
    const pool=doable.filter(x=>x.name!==curName);
    const pick=(pool.length?pool:doable)[Math.floor(Math.random()*(pool.length?pool.length:doable.length))];
    if(!CYCLE.slotCustom) CYCLE.slotCustom={};
    CYCLE.slotCustom[slotKey(di,slot)]=pick.name;   // nom fixe pour le reste du cycle
    delete (CYCLE.slotOverride||{})[slotKey(di,slot)]; // l'override d'index ne s'applique plus
    if(SESSION && SESSION.day===di){
      const se=SESSION.ex.find(e=>e.slot===slot);
      if(se){ se.name=pick.name; se.sessOverride='equip:'+pick.name; }
      store.set('session',SESSION);
    }
    store.set('cycle',CYCLE);
    equipPicker=null;
    toast("Pour tout le cycle : "+pick.name);
    render();
    return;
  }

  // mode séance : ne touche qu'à la séance en cours
  if(!SESSION || SESSION.day!==di){ toast("Démarre la séance d'abord"); return; }
  const se=SESSION.ex.find(e=>e.slot===slot);
  if(!se)return;
  const curName=se.name;
  const pool=doable.filter(x=>x.name!==curName);
  const pick=(pool.length?pool:doable)[Math.floor(Math.random()*(pool.length?pool.length:doable.length))];
  se.name=pick.name;
  se.sessOverride='equip:'+pick.name;
  store.set('session',SESSION);
  equipPicker=null;
  toast("Pour cette séance : "+pick.name);
  render();
}

// charge affichée pour un exo principal à une semaine donnée
/* Progression sur le bloc de 8 semaines (périodisation linéaire de force).
   Les reps baissent par palier pendant que l'intensité monte, pour se rapprocher du 1RM.
   reps = décalage appliqué aux reps de base du mouvement (sem1) ; mult = charge relative à la
   charge de travail de base. Semaine 8 = deload (léger, reps de reprise). */
const WEEK_PROG = [
  {repsDelta: 0,  mult:1.00},  // S1 : reps de base, charge de base
  {repsDelta: 0,  mult:1.03},  // S2 : mêmes reps, un peu plus lourd
  {repsDelta:-1,  mult:1.06},  // S3 : -1 rep
  {repsDelta:-1,  mult:1.09},  // S4
  {repsDelta:-2,  mult:1.13},  // S5 : -2 reps
  {repsDelta:-2,  mult:1.16},  // S6
  {repsDelta:-3,  mult:1.20},  // S7 : -3 reps, le plus lourd (proche du PR)
  {repsDelta: 0,  mult:0.80},  // S8 : deload
];
function weekReps(baseReps, week){
  const p = WEEK_PROG[week-1] || WEEK_PROG[0];
  return Math.max(1, (baseReps||5) + p.repsDelta);
}
function mainLoad(lift, week, loadFactor){
  let w = CYCLE.loads[lift];
  const p = WEEK_PROG[week-1] || WEEK_PROG[0];
  return roundW(w * p.mult * (loadFactor||1));
}
function rpeTarget(week){ return RPE_TARGET_BY_WEEK[week-1]; }

/* Génère les séries d'échauffement pour un gros mouvement, d'après la charge de travail.
   Démarre à une charge FIXE par mouvement, monte vers la charge de travail. Les reps
   d'échauffement sont calées sur les reps de travail (workReps) : elles partent un peu au-dessus
   puis descendent, sans jamais fatiguer. Ne compte pas dans le volume. */
const WARM_START = { bench:60, squat:70, deadlift:70, ohp:30 }; // 1re série de chauffe (kg)
function warmupSets(workW, lift, workReps){
  const bar=20;
  if(!workW || workW<=bar+10) return [];
  const wr = Math.max(1, parseInt(workReps)||5);
  // reps d'échauffement dégressives, référencées sur les reps de travail
  // barre : wr+3 ; 1er palier : wr ; palier ~60% : ceil(wr/2) ; palier ~80% : 1-2
  const rBar = wr+3;
  const r1   = wr;
  const rMid = Math.max(2, Math.ceil(wr/2));
  const rTop = wr<=3 ? 1 : 2;
  const out=[];
  if(lift!=='deadlift') out.push({w:bar, r:rBar, bar:true});
  const start = WARM_START[lift];
  if(start && start>bar && start < workW*0.9){ out.push({w:roundW(start), r:r1}); }
  const mids = lift==='deadlift' ? [0.65,0.8] : [0.6,0.8];
  const midReps = [rMid, rTop];
  mids.forEach((p,i)=>{
    const w=roundW(workW*p);
    if(w>bar && w>out[out.length-1].w && w < workW*0.92){ out.push({w, r:midReps[i]}); }
  });
  return out;
}

function marginText(week){
  const t=rpeTarget(week);
  const reserve = Math.round((10-t));
  if(week===DELOAD_WEEK) return "Deload — RPE cible 6 (reste très facile, ~4 reps en réserve)";
  return `RPE cible cette semaine : ${t} (~${reserve} rep${reserve>1?'s':''} en réserve)`;
}

/* ================= TEST PR (fin de bloc) ================= */
// 1RM estimé à partir de la performance RÉELLE de fin de bloc (idéalement semaine 7, le pic).
// On utilise la meilleure série capturée : charge, reps et RPE réels.
// Méthode : reps-jusqu'à-l'échec = reps + (10 - RPE) ; 1RM = charge × (1 + repsÉchec/30) (Epley).
const LIFT_BASEREPS = { squat:5, bench:5, deadlift:4 };
function e1RM(weight, reps, rpe){
  const rir = (rpe!=null && !isNaN(rpe)) ? Math.max(0,(10-rpe)) : 0;
  const repsToFailure = (reps||1) + rir;
  return Math.round(weight*(1+repsToFailure/30));
}
// enregistre la meilleure série de travail d'un gros mouvement pour la semaine donnée
function captureLiftResult(e, week){
  if(!e || !e.lift || !e.main) return;
  if(!CYCLE.results) CYCLE.results={};
  // meilleure série = celle qui donne le 1RM estimé le plus élevé
  let best=null;
  e.sets.forEach(s=>{
    const w=parseFloat(s.w), r=parseFloat(s.r), rpe=parseFloat(s.rpe);
    if(!w||!r) return;
    const est=e1RM(w,r,isNaN(rpe)?null:rpe);
    if(!best || est>best.est) best={w,r,rpe:isNaN(rpe)?null:rpe,est};
  });
  if(best){
    if(!CYCLE.results[e.lift]) CYCLE.results[e.lift]={};
    // garde la meilleure estimation de la semaine (une séance technique allégée ne l'abaisse pas)
    const existing = CYCLE.results[e.lift][week];
    if(!existing || best.est > existing.est) CYCLE.results[e.lift][week]=best;
  }
}
function estimatedMaxFromCycle(lift){
  if(!CYCLE) return PR[lift];
  const res = CYCLE.results && CYCLE.results[lift];
  // priorité à la perf réelle : semaine 7, sinon 6, sinon 5, sinon la plus récente dispo
  if(res){
    for(const wk of [7,6,5,4,3,2,1]){
      if(res[wk]) return res[wk].est;
    }
  }
  // fallback : estimation planifiée (avant d'avoir fait la semaine 7)
  const peak = mainLoad(lift, 7);
  const reps = weekReps(LIFT_BASEREPS[lift]||5, 7);
  return Math.round(peak*(1+reps/30));
}
// suggère les paliers vers un 1RM cible pour la séance de test
function prAttempts(target, lift){
  const bar=20;
  const steps=[0.4,0.6,0.75,0.85,0.93,1.0];
  const reps =[5,3,2,1,1,1];
  const out=[];
  if(lift!=='deadlift') out.push({w:bar, r:6, bar:true, warm:true});
  steps.forEach((p,i)=>{
    const w=roundW(target*p);
    if(w>bar && (out.length===0 || w>out[out.length-1].w)){
      out.push({w, r:reps[i], warm:p<0.9, attempt:p>=0.9});
    }
  });
  return out;
}

/* En fin de séance : on RECALCULE la charge de base du lift à partir de la CAPACITÉ
   RÉELLE démontrée pendant la séance (meilleure série : charge + reps + RPE), ramenée
   au RPE cible de la semaine. La semaine suivante — et toutes les suivantes — repart de
   cette capacité. Sans plafond : trop facile → la charge monte franchement ; trop dur →
   elle redescend. Les jours "technique" allégés ne pilotent pas la progression. */
function updateLiftFromSession(e, week){
  // capture de la meilleure série de travail (pour l'estimation du test PR en fin de bloc)
  captureLiftResult(e, week);
  if(week===DELOAD_WEEK) return;              // pas de mise à jour de charge en deload
  if((e.loadFactor||1) < 1) return;           // jour "technique" (allégé) : ne fait pas progresser la base
  const target = rpeTarget(week);
  const targetRIR = Math.max(0, 10 - target);
  const baseReps = e.targetReps || 5;
  const tReps = weekReps(baseReps, week);     // reps cibles de cette semaine
  const p = WEEK_PROG[week-1] || WEEK_PROG[0];

  // Capacité démontrée : pour chaque série valable (charge + reps + RPE réels), on estime
  // un 1RM (Epley avec reps en réserve), puis la charge qui donnerait le RPE cible aux reps
  // cibles. On retient la MEILLEURE série (une série ratée isolée ne fait pas chuter la charge).
  let bestCap = null;
  e.sets.forEach(s=>{
    const w = parseFloat(s.w), r = parseFloat(s.r), rpe = parseFloat(s.rpe);
    if(!w || !r || isNaN(rpe)) return;
    const rir = Math.max(0, 10 - rpe);
    const oneRM = w * (1 + (r + rir)/30);               // 1RM estimé de la série
    const capW = oneRM / (1 + (tReps + targetRIR)/30);  // charge au RPE cible, reps cibles
    if(bestCap === null || capW > bestCap) bestCap = capW;
  });

  // SIGNAL NET ? (zone de tolérance ±1 RPE). On ne bouge la charge que si :
  //  - au moins 2 séries clairement faciles (RPE ≤ cible-1) → sustained, on monte ;
  //  - ou 1 série très facile (écart ≥ 2) ;
  //  - ou l'équivalent en trop dur → on baisse.
  // Sinon, on est dans la cible (une série isolée un peu facile = fatigue/bruit) → on ne change rien.
  let easyN=0, hardN=0, bigEasy=false, bigHard=false;
  e.sets.forEach(s=>{ const rpe=parseFloat(s.rpe); if(isNaN(rpe)) return;
    const gap = target - rpe;                 // >0 = plus facile que la cible
    if(gap>=1) easyN++;   if(gap<=-1) hardN++;
    if(gap>=2) bigEasy=true;   if(gap<=-2) bigHard=true;
  });
  const clearSignal = (easyN>=2 || bigEasy || hardN>=2 || bigHard);

  let nextActual;
  if(bestCap !== null){
    if(!clearSignal){ CYCLE.lastAdj[e.lift]={delta:0, week}; return; }  // dans la cible : charge conservée
    nextActual = bestCap;                     // sans plafond : on cale sur la capacité réelle
  }else{
    // aucune série avec RPE : ajustement doux depuis la dernière série renseignée
    let last=null, lastReps=null, lastW=null;
    e.sets.forEach(s=>{ if(s.rpe!=null && s.rpe!==''){ last=parseFloat(s.rpe); lastReps=parseFloat(s.r)||null; lastW=parseFloat(s.w)||null; } });
    if(last==null) return;                    // rien de saisi : on ne change rien
    const actual = lastW || (CYCLE.loads[e.lift]*p.mult);
    nextActual = suggestNextLoad(actual, target, last, tReps, lastReps);
  }

  const nextBase = roundW(nextActual / (p.mult||1));   // reconverti en charge de BASE (semaine 1)
  const before = CYCLE.loads[e.lift];
  CYCLE.loads[e.lift] = nextBase;
  CYCLE.lastAdj[e.lift] = {delta: nextBase - before, week};
}

/* ================= REST ================= */
/* Minuteur de repos basé sur l'HEURE RÉELLE (restEnd = timestamp de fin).
   Le décompte reste juste même si l'app est mise en veille / l'écran verrouillé :
   au retour, on recalcule le temps restant depuis l'horloge. À 0, notification + vibration. */
let restInt=null, restEnd=0;
function restStart(sec){
  restEnd = Date.now() + sec*1000;
  store.set('restEnd', restEnd);
  const el=document.getElementById('rest'); el.classList.add('show');
  requestNotifPermission();            // demande l'autorisation (geste utilisateur : clic "série faite")
  restTick();
  clearInterval(restInt);
  restInt=setInterval(restTick, 250);
}
function restTick(){
  if(!restEnd) return;
  const left = Math.round((restEnd - Date.now())/1000);
  const el=document.getElementById('restT'); if(el) el.textContent=fmtT(Math.max(0,left));
  if(left<=0) restDone();
}
function restDone(){
  clearInterval(restInt); restInt=null; restEnd=0; store.set('restEnd',0);
  const el=document.getElementById('rest'); if(el) el.classList.remove('show');
  if(navigator.vibrate) navigator.vibrate([300,120,300]);
  notify("Repos terminé 💪","C'est reparti — série suivante.");
  toast("Repos terminé");
}
function restAdd(s){ if(!restEnd) return; restEnd += s*1000; store.set('restEnd',restEnd); restTick(); }
function restStop(){ clearInterval(restInt); restInt=null; restEnd=0; store.set('restEnd',0);
  const el=document.getElementById('rest'); if(el) el.classList.remove('show'); }

/* ----- Notifications (fin de repos) ----- */
function requestNotifPermission(){
  try{ if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); } }catch(e){}
}
function notify(title, body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      if(navigator.serviceWorker && navigator.serviceWorker.ready){
        navigator.serviceWorker.ready
          .then(reg=>reg.showNotification(title,{body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', vibrate:[300,120,300], tag:'rest', renotify:true}))
          .catch(()=>{ try{ new Notification(title,{body}); }catch(e){} });
      } else { try{ new Notification(title,{body}); }catch(e){} }
    }
  }catch(e){}
}

/* ================= NAV ================= */
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));render();window.scrollTo(0,0);}

/* ================= RENDER ================= */
function render(){
  const m=document.getElementById('main');
  try{
    const cycTxt = CYCLE ? `Cycle ${CYCLE.num} · Semaine ${curWeek} / 8` : "Non démarré";
    document.getElementById('cycInfo').innerHTML = TESTMODE ? `<span style="color:var(--gold)">🧪 ESSAI</span> · ${cycTxt}` : cycTxt;
    if(!CYCLE){ renderStart(m); return; }
    if(view==='today') renderToday(m);
    else if(view==='cycle') renderCycle(m);
    else if(view==='next') renderNext(m);
    else if(view==='prs') renderPRs(m);
    else if(view==='prtest') renderPRTest(m);
    else if(view==='history') renderHistory(m);
  }catch(e){
    m.innerHTML=`<div class="card"><h2>Un souci d'affichage</h2>
      <p class="muted">Une donnée sauvegardée n'était pas compatible. Tu peux réparer sans perdre ton historique.</p>
      <button class="btn" style="margin-top:8px" onclick="repairState()">Réparer</button></div>`;
    console.error(e);
  }
}
// abandonne une session/état corrompu sans toucher aux records ni à l'historique
function repairState(){
  SESSION=null; store.set('session',null);
  if(CYCLE){ if(!CYCLE.nextOverride)CYCLE.nextOverride={}; if(!CYCLE.slotOverride)CYCLE.slotOverride={}; store.set('cycle',CYCLE); }
  view='today'; toast("Réparé"); render();
}

function renderStart(m){
  m.innerHTML=`<div class="card"><h2>Ton cycle de 8 semaines</h2>
    <p class="muted">Un seul programme, 4 séances/semaine (haut/bas), auto-régulé à ton ressenti. Les charges montent semaine après semaine et s'ajustent selon comment tu sens tes séries. La semaine 8 est un deload, puis tu retestes tes max.</p>
    <div class="note">Avant de démarrer, vérifie tes records dans l'onglet <b>Records</b> — ils servent de point de départ pour les charges.</div>
    <button class="btn" onclick="startCycle()" style="margin-top:6px">Démarrer le cycle</button>
  </div>`;
}
function startCycle(){ CYCLE=initCycle(0); curWeek=1; curDay=0; store.set('cycle',CYCLE); toast("Cycle 1 démarré 💪"); render(); }

function renderToday(m){
  // bandeau semaines
  let wk=`<div class="weeks">`;
  for(let w=1;w<=8;w++){
    const dl=w===DELOAD_WEEK;
    const doneCount=[0,1,2,3].filter(d=>CYCLE.dayDone[w+'-'+d]).length;
    const allDone=doneCount===4;
    wk+=`<div class="wk ${w===curWeek?'on':''} ${dl?'deload':''} ${allDone?'done':''}" onclick="pickWeek(${w})">
      <div class="n">${w}</div><div class="p">${dl?'deload':weekReps(5,w)+' reps'}</div></div>`;
  }
  wk+=`</div>`;

  // jours
  let dstrip=`<div class="days">`+DAYS.map((d,i)=>{
    const done=CYCLE.dayDone[curWeek+'-'+i];
    return `<button class="daybtn ${i===curDay?'on':''} ${done?'ok':''}" onclick="pickDay(${i})">${done?'✓ ':''}${d.name}</button>`;
  }).join('')+`</div>`;

  const day=DAYS[curDay];
  const active = SESSION && SESSION.week===curWeek && SESSION.day===curDay && sessionValid(SESSION);
  const alreadyDone = CYCLE.dayDone[curWeek+'-'+curDay] && !active;

  // détecte les séances non faites dans les semaines déjà entamées avant la semaine courante
  let missedBanner='';
  const missed=[];
  for(let w=1;w<curWeek;w++){
    const doneAny=[0,1,2,3].some(d=>CYCLE.dayDone[w+'-'+d]);
    if(!doneAny) continue; // semaine jamais commencée = ignorée (pas "manquée")
    [0,1,2,3].forEach(d=>{ if(!CYCLE.dayDone[w+'-'+d]) missed.push({w,d}); });
  }
  if(missed.length && !CYCLE.missedDismissed){
    const list=missed.slice(0,4).map(x=>`S${x.w} · ${DAYS[x.d].name}`).join(', ');
    missedBanner=`<div class="miss">
      <div class="misshead">Séances non réalisées</div>
      <div class="misstxt">${missed.length} séance${missed.length>1?'s':''} sautée${missed.length>1?'s':''} : ${list}${missed.length>4?'…':''}</div>
      <div class="missrow">
        <button class="btn sm ghost" onclick="dismissMissed()">Ignorer (avancer)</button>
        <button class="btn sm" onclick="rescheduleMissed()">Rattraper cette semaine</button>
      </div>
      <div class="tiny" style="margin-top:6px">« Rattraper » place la séance sautée la plus prioritaire (gros mouvement) sur un jour libre de la semaine en cours. « Ignorer » continue sans rattrapage — la progression reste fondée sur ce que tu as réellement fait.</div>
    </div>`;
  }

  let body=missedBanner+`<div class="note ${curWeek===DELOAD_WEEK?'blue':''}">${marginText(curWeek)}</div>`;
  if(curWeek!==DELOAD_WEEK) body+=`<div class="note blue">Objectif : <b>force au squat / couché / terre</b>. Les gros lifts pilotent tout (reste au RPE cible, pas à l'échec). Les accessoires vont <b>proche de l'échec</b> (1–2 reps en réserve) pour faire grossir les muscles qui portent ces lifts.</div>`;

  body+=day.ex.map((ex,ei)=>{
    const isMain=ex.main;
    const baseLoad=isMain?mainLoad(ex.lift,curWeek,ex.loadFactor):null;
    // RPE cible de CET exo : les jours "technique/vitesse" (allégés) visent un RPE plus bas
    const tgtRPE=Math.max(5, rpeTarget(curWeek) + (ex.rpeDelta||0));
    // nom affiché (tient compte des remplacements de séance) — remonté ici car utilisé par les mouvements
    const rez=resolveExo(ex, curDay, 'cur');
    let dispName=rez.name;
    if(active && ex.slot){
      const se=SESSION.ex[ei];
      if(se && typeof se.sessOverride==='string' && se.sessOverride.startsWith('equip:')) dispName=se.name;
      else if(se && typeof se.sessOverride==='number' && rez.list[se.sessOverride]!=null) dispName=rez.list[se.sessOverride];
      else if(se && se.name) dispName=se.name;
    }
    const exKey = slotKey(curDay, ex.slot||('x'+ei));
    const movements = isMain ? null : exMovements(ex, curDay, dispName, exKey);
    const techTxt = isMain ? (TECH[ex.lift]||'') : (TECH[ex.slot]||'');
    let sets='';
    let headMain = isMain
      ? `<div class="rowhead"><span></span><span>Charge</span><span>Reps${ex.targetReps?` /${weekReps(ex.targetReps,curWeek)}`:''}</span><span>RPE /${tgtRPE}</span><span></span></div>`
      : ``;
    const wkTargetReps = ex.targetReps ? weekReps(ex.targetReps, curWeek) : null;
    // séries d'échauffement (gros mouvements uniquement), calculées sur la charge de travail
    let warm='';
    if(isMain){
      const wu=warmupSets(baseLoad, ex.lift, wkTargetReps);
      if(wu.length){
        warm=`<div class="wuhead">Échauffement <span class="tiny">(non compté)</span></div>`+
          wu.map((w,wi)=>`<div class="setrow wu">
            <div class="si">·</div>
            <div class="wuw">${w.bar?'Barre':w.w+' kg'}</div>
            <div class="wur">${w.r} reps</div>
            <div></div><div></div>
          </div>`).join('')+
          `<div class="wusep">Séries de travail — ${wkTargetReps} reps · RPE ${tgtRPE}</div>`;
      }
    }
    for(let s=0;s<ex.sets;s++){
      const sd=active?SESSION.ex[ei].sets[s]:null;
      // charge suggérée : série 1 = baseLoad ; suivantes = adaptée d'après série précédente si RPE saisi
      let sugg=baseLoad;
      if(active && isMain && s>0){
        const prev=SESSION.ex[ei].sets[s-1];
        if(prev.rpe!=null && prev.rpe!=='' ){
          const prevW=parseFloat(prev.w)||baseLoad;
          sugg=suggestNextLoad(prevW, tgtRPE, parseFloat(prev.rpe), wkTargetReps||5, parseFloat(prev.r)||null);
        }else{ sugg=parseFloat(prev.w)||baseLoad; }
      }
      // si l'utilisateur n'a PAS édité la charge de cette série à la main, on affiche la suggestion
      let wVal;
      if(isMain && active && s>0 && sd && !sd.wEdited){
        wVal = sugg!==null?sugg:'';
        if(sd.w!==String(wVal)){ sd.w=String(wVal); } // garde le stock synchro avec la suggestion
      }else{
        wVal = sd&&sd.w!==''?sd.w:(sugg!==null?sugg:'');
      }
      // reps pré-remplies avec la cible de la semaine (modifiable ensuite)
      let rVal;
      if(isMain && active && sd && !sd.rEdited && wkTargetReps){
        rVal = String(wkTargetReps);
        if(sd.r!==rVal){ sd.r=rVal; } // synchro du stock avec la valeur par défaut
      }else{
        rVal = sd&&sd.r!==''?sd.r:'';
      }
      const rpeVal = sd&&sd.rpe!=null&&sd.rpe!==''?sd.rpe:'';
      const done=sd&&sd.done;
      // indice d'adaptation sur cette série (par rapport à la précédente)
      let flag='';
      if(active && isMain && s>0){
        const prev=SESSION.ex[ei].sets[s-1];
        if(prev.rpe!=null && prev.rpe!==''){
          const prevW=parseFloat(prev.w)||baseLoad;
          const d=(parseFloat(wVal)||sugg)-prevW;
          if(d>0) flag=`<span class="adj up">+${d}</span>`;
          else if(d<0) flag=`<span class="adj down">${d}</span>`;
        }
      }
      if(isMain){
        sets+=`<div class="setrow main">
          <div class="si">${s+1}${flag}</div>
          <div><input inputmode="decimal" placeholder="kg" value="${wVal}" onchange="setVal(${ei},${s},'w',this.value)" ${active?'':'disabled'}></div>
          <div><input inputmode="numeric" placeholder="reps" value="${rVal}" onchange="setVal(${ei},${s},'r',this.value)" ${active?'':'disabled'}></div>
          <div><input inputmode="decimal" placeholder="rpe" value="${rpeVal}" onchange="setRPE(${ei},${s},this.value)" ${active?'':'disabled'} class="rpein"></div>
          <div class="chk ${done?'done':''}" onclick="${active?`toggleSet(${ei},${s},${ex.rest||90})`:''}">${done?'✓':''}</div>
        </div>`;
      }else{
        // accessoire : une ligne de saisie par mouvement, selon son type
        const movHtml = movements.map((mov,mi)=>{
          const mm = (sd && sd.m && sd.m[mi]) ? sd.m[mi] : {};
          const nm = mov.name;
          if(mov.kind==='hold'){
            const tVal = (mm.t!=null&&mm.t!=='')?mm.t:'';
            const df = mm.d||'';
            return `<div class="movline">
              <div class="movname">${nm} <span class="tiny">tenue (sec)</span></div>
              <div class="movin">
                <input inputmode="numeric" placeholder="sec" value="${tVal}" onchange="setMov(${ei},${s},${mi},'t',this.value)" ${active?'':'disabled'} style="max-width:90px">
                <div class="diffs">
                  <button class="df ${df==='easy'?'on':''}" onclick="${active?`setMovDiff(${ei},${s},${mi},'easy')`:''}">Facile</button>
                  <button class="df ${df==='ok'?'on':''}" onclick="${active?`setMovDiff(${ei},${s},${mi},'ok')`:''}">Correct</button>
                  <button class="df ${df==='hard'?'on':''}" onclick="${active?`setMovDiff(${ei},${s},${mi},'hard')`:''}">Dur</button>
                </div>
              </div>
            </div>`;
          }
          if(mov.kind==='body'){
            const rVal2 = (mm.r!=null&&mm.r!=='')?mm.r:'';
            return `<div class="movline">
              <div class="movname">${nm} <span class="tiny">poids du corps</span></div>
              <div class="movin"><input inputmode="numeric" placeholder="reps" value="${rVal2}" onchange="setMov(${ei},${s},${mi},'r',this.value)" ${active?'':'disabled'}></div>
            </div>`;
          }
          const wV = (mm.w!=null&&mm.w!=='')?mm.w:'';
          const rV = (mm.r!=null&&mm.r!=='')?mm.r:'';
          return `<div class="movline">
            ${movements.length>1?`<div class="movname">${nm}</div>`:''}
            <div class="movin">
              <input inputmode="decimal" placeholder="kg" value="${wV}" onchange="setMov(${ei},${s},${mi},'w',this.value)" ${active?'':'disabled'}>
              <input inputmode="numeric" placeholder="reps" value="${rV}" onchange="setMov(${ei},${s},${mi},'r',this.value)" ${active?'':'disabled'}>
            </div>
          </div>`;
        }).join('');
        sets+=`<div class="setrow acc">
          <div class="si">${s+1}</div>
          <div class="movwrap">${movHtml}</div>
          <div class="chk ${done?'done':''}" onclick="${active?`toggleSet(${ei},${s},${ex.rest||90})`:''}">${done?'✓':''}</div>
        </div>`;
      }
    }
    // rappel de l'ajustement reporté sur la charge de départ (séance précédente)
    let adj='';
    if(isMain){
      const a=CYCLE.lastAdj[ex.lift];
      if(a && a.delta!==0){
        const cls=a.delta>0?'up':'down';
        adj=`<span class="adj ${cls}">${a.delta>0?'+':''}${a.delta} kg / séance préc.</span>`;
      }
    }
    // (nom affiché « dispName » et « rez » calculés plus haut)
    // bouton de correction du type de saisie (accessoires uniquement)
    let typeBtn='';
    if(!isMain){
      const ov=CYCLE.kindOverride&&CYCLE.kindOverride[exKey];
      typeBtn=`<button class="typebtn ${ov?'set':''}" onclick="cycleKind(${curDay},'${exKey}')" title="Type de saisie : avec poids / poids du corps / gainage">⚙︎ ${kindLabel(ov)}</button>`;
    }
    let swapBtns='';
    let picker='';
    if(ex.slot && rez.count>1){
      const isCustom = rez.custom;
      if(active){
        swapBtns=`<div class="swaprow">
          <button class="swap" onclick="openEquipPicker('${ex.slot}','session')" title="Remplacer seulement aujourd'hui selon le matériel dispo">🔧 pas cette séance</button>
          <button class="swap alt" onclick="openEquipPicker('${ex.slot}','cycle')" title="Remplacer pour tout le cycle selon la salle">⇄ tout le cycle</button>
        </div>`;
      }else{
        swapBtns=`<button class="swap alt" onclick="openEquipPicker('${ex.slot}','cycle')" title="Remplacer pour tout le cycle selon la salle">⇄ non faisable ce cycle</button>`;
      }
      // panneau matériel (si ouvert pour ce slot), filtré au muscle
      if(equipPicker && equipPicker.slot===ex.slot){
        const mode=equipPicker.mode;
        const muscle=SLOT_MUSCLE[ex.slot]||'';
        const eq=(CYCLE&&CYCLE.equip)||{};
        const rel=relevantEquip(ex.slot);
        const chips=rel.map(id=>
          `<button class="chip ${eq[id]?'on':''}" onclick="toggleEquip('${id}')">${EQUIP[id]}</button>`).join('');
        const intro = mode==='cycle'
          ? `Remplacement <b>pour tout le cycle</b> (salle où tu es). Muscle : <b>${muscle}</b>. Coche le matériel disponible ici :`
          : `Remplacement <b>juste pour cette séance</b>. Muscle : <b>${muscle}</b>. Coche le matériel libre en ce moment :`;
        picker=`<div class="picker">
          <div class="pklabel">${intro}</div>
          <div class="chips">${chips}</div>
          <button class="btn sm" style="margin-top:10px" onclick="chooseByEquip(${curDay},'${ex.slot}','${mode}')">Proposer un exercice</button>
          ${isCustom&&mode==='cycle'?`<button class="btn sm ghost" style="margin-top:6px" onclick="resetCustom(${curDay},'${ex.slot}')">Revenir à l'exercice d'origine</button>`:''}
        </div>`;
      }
    }
    return `<div class="ex"><div class="top">
        <div class="namerow"><div class="name">${dispName} ${adj}</div>
          <div class="btnrow">
            <button class="vid" onclick="watchExo('${dispName.replace(/'/g,"\\'")}')" title="Voir une vidéo de l'exercice">▶ vidéo</button>
            ${typeBtn}
            ${active?'':swapBtns}
          </div>
        </div>
        ${active&&swapBtns?`<div class="swapwrap">${swapBtns}</div>`:''}
        ${picker}
        <div class="meta">${ex.sets} × ${ex.reps} · repos ${ex.rest?Math.round(ex.rest/60*10)/10+' min':'—'}${isMain?` · départ ${baseLoad} kg`:` · vise 1–2 reps en réserve`}</div>
        ${ex.cue?`<div class="cue">${ex.cue}</div>`:''}
        ${techTxt?`<div class="tech">🔧 ${techTxt}</div>`:''}
      </div>${headMain}${warm}${sets}</div>`;
  }).join('');

  if(active){
    body+=`<div class="row" style="margin-top:12px"><button class="btn ghost" onclick="cancelSession()">Annuler</button>
      <button class="btn" onclick="finishSession()">Terminer & ajuster</button></div>`;
  }else if(alreadyDone){
    body+=`<div class="note blue">Séance déjà validée. Tu peux la refaire (ça écrasera l'entrée) ou passer à la suivante.</div>
      <button class="btn ghost" onclick="startSession()" style="margin-top:4px">Refaire cette séance</button>`;
  }else{
    body+=`<button class="btn" onclick="startSession()" style="margin-top:12px">Démarrer cette séance</button>`;
  }

  // Fin de bloc : quand la semaine 8 (deload) est complète et le test PR pas encore fait
  const week8done=[0,1,2,3].every(d=>CYCLE.dayDone[DELOAD_WEEK+'-'+d]);
  if(week8done && !CYCLE.prTested){
    body+=`<div class="miss" style="border-color:rgba(78,201,138,0.4);background:rgba(78,201,138,0.08)">
      <div class="misshead" style="color:var(--ok)">Bloc terminé — teste tes maxs</div>
      <div class="misstxt">Les 8 semaines sont bouclées. Place à la séance de test 1RM pour mettre à jour tes records.</div>
      <button class="btn" onclick="go('prtest')">Aller à la séance de test PR</button>
    </div>`;
  }

  m.innerHTML=wk+dstrip+body;
}

function pickWeek(w){ curWeek=w; equipPicker=null; render(); }
function pickDay(i){ curDay=i; equipPicker=null; render(); }

function dismissMissed(){ if(!CYCLE)return; CYCLE.missedDismissed=true; store.set('cycle',CYCLE); toast("On continue sur la lancée"); render(); }
function rescheduleMissed(){
  if(!CYCLE)return;
  const missed=[];
  for(let w=1;w<curWeek;w++){
    const doneAny=[0,1,2,3].some(d=>CYCLE.dayDone[w+'-'+d]);
    if(!doneAny)continue;
    [0,1,2,3].forEach(d=>{ if(!CYCLE.dayDone[w+'-'+d]) missed.push({w,d}); });
  }
  if(!missed.length){ render(); return; }
  // priorité au jour du plus gros mouvement : Bas B (terre)=2, Bas A (squat)=0, Haut A=1, Haut B=3
  const prio={2:0,0:1,1:2,3:3};
  missed.sort((a,b)=>prio[a.d]-prio[b.d]);
  const pick=missed[0];
  let target=null;
  for(let d=0;d<4;d++){ if(!CYCLE.dayDone[curWeek+'-'+d]){ target=d; break; } }
  if(target==null){ toast("Semaine déjà pleine — passe à la semaine suivante"); return; }
  CYCLE.dayDone[pick.w+'-'+pick.d]='skipped';
  curDay=pick.d;
  store.set('cycle',CYCLE);
  toast("Rattrapage : "+DAYS[pick.d].name);
  render();
}

function startSession(){
  const day=DAYS[curDay];
  SESSION={week:curWeek, day:curDay, name:day.name,
    ex:day.ex.map((ex,ei)=>{
      const exName=resolveExo(ex, curDay, 'cur').name;
      const key=slotKey(curDay, ex.slot||('x'+ei));
      const movements = ex.main ? null : exMovements(ex, curDay, exName, key);
      return {
        name:exName, slot:ex.slot||null, lift:ex.lift||null,
        main:!!ex.main, targetReps:ex.targetReps||null, loadFactor:ex.loadFactor||1,
        sets:Array.from({length:ex.sets},(_,s)=>{
          // gros mouvement : charge auto-régulée (modèle w/r/rpe inchangé)
          if(ex.main){
            const load=mainLoad(ex.lift,curWeek,ex.loadFactor);
            return {w:load!==null?String(load):'', r:'', rpe:'', done:false};
          }
          // accessoire : une entrée par mouvement, pré-remplie depuis la mémoire
          const m = movements.map(mov=>{
            if(mov.kind==='hold'){
              const t=(EXW[mov.name]&&EXW[mov.name].t!=null)?EXW[mov.name].t:holdSecs(mov.repTok);
              return {t: t!=null?String(t):'', d:''};
            }
            if(mov.kind==='body') return {r:''};
            const w=(EXW[mov.name]&&EXW[mov.name].w!=null)?EXW[mov.name].w:'';
            return {w: w!==''?String(w):'', r:''};
          });
          return {done:false, m};
        })
      };
    })};
  store.set('session',SESSION); render();
}
function setVal(ei,s,f,v){if(!SESSION)return;SESSION.ex[ei].sets[s][f]=v;
  if(f==='w'){ SESSION.ex[ei].sets[s].wEdited=true; }
  if(f==='r'){ SESSION.ex[ei].sets[s].rEdited=true; }
  store.set('session',SESSION);
  render(); /* recalculer les suggestions en aval */ }
function setRPE(ei,s,v){if(!SESSION)return;SESSION.ex[ei].sets[s].rpe=v;store.set('session',SESSION);render();}
// saisie par mouvement (accessoires / supersets / gainage)
function setMov(ei,s,mi,f,v){ if(!SESSION)return; const st=SESSION.ex[ei].sets[s]; if(!st.m)st.m=[]; if(!st.m[mi])st.m[mi]={}; st.m[mi][f]=v; store.set('session',SESSION); }
function setMovDiff(ei,s,mi,d){ if(!SESSION)return; const st=SESSION.ex[ei].sets[s]; if(!st.m)st.m=[]; if(!st.m[mi])st.m[mi]={}; st.m[mi].d=d; store.set('session',SESSION); render(); }
function toggleSet(ei,s,rest){if(!SESSION)return;const d=SESSION.ex[ei].sets[s];d.done=!d.done;store.set('session',SESSION);
  if(d.done&&rest)restStart(rest);render();}
function cancelSession(){if(confirm("Annuler la séance en cours ?")){SESSION=null;store.set('session',null);restStop();render();}}

async function finishSession(){
  if(!SESSION)return;
  // met à jour la charge de départ de chaque lift principal pour la prochaine séance
  SESSION.ex.forEach(e=>{ if(e.main && e.lift){ updateLiftFromSession(e, SESSION.week); } });
  CYCLE.dayDone[SESSION.week+'-'+SESSION.day]=true;

  const day=DAYS[SESSION.day];
  const recEx = SESSION.ex.map((e,ei)=>{
    if(e.main) return {name:e.name, main:true, sets:e.sets.filter(s=>s.done||s.w||s.r)};
    const dex=day.ex[ei];
    const key=slotKey(SESSION.day,(dex&&dex.slot)||('x'+ei));
    const movs=exMovements(dex, SESSION.day, e.name, key);
    return {name:e.name, main:false, movs:movs.map(mo=>({name:mo.name, kind:mo.kind})),
      sets:e.sets.filter(s=> s.done || (s.m&&s.m.some(x=> x&&(x.w||x.r||x.t))) )};
  });
  const rec={date:new Date().toISOString(), week:SESSION.week, name:SESSION.name, ex:recEx};
  LOG.unshift(rec);

  // mémorise, PAR MOUVEMENT, la dernière valeur saisie (repris à la prochaine apparition
  // de l'exo : séance suivante ET cycle suivant). Poids -> dernier kg ; gainage -> dernier
  // temps, +15 s si noté "Facile" (sinon on garde le même temps).
  SESSION.ex.forEach((e,ei)=>{
    if(e.main) return;
    const dex=day.ex[ei];
    const key=slotKey(SESSION.day,(dex&&dex.slot)||('x'+ei));
    const movs=exMovements(dex, SESSION.day, e.name, key);
    movs.forEach((mov,mi)=>{
      if(mov.kind==='hold'){
        // temps : dernière tenue saisie ; difficulté : agrégée (un "Dur" prime, sinon un "Facile" -> +15s)
        let lastT=null; const diffs=[];
        e.sets.forEach(s=>{ const mm=s.m&&s.m[mi]; if(!mm)return;
          const t=parseFloat(mm.t); if(!isNaN(t)&&t>0) lastT=t;
          if(mm.d) diffs.push(mm.d);
        });
        if(lastT!=null){ const bump=(diffs.includes('easy')&&!diffs.includes('hard'))?15:0; EXW[mov.name]={t:lastT+bump}; }
      } else if(mov.kind==='weight'){
        let lastW=null;
        e.sets.forEach(s=>{ const mm=s.m&&s.m[mi]; if(!mm)return; const w=parseFloat(mm.w); if(!isNaN(w)&&w>0) lastW=w; });
        if(lastW!=null) EXW[mov.name]={w:lastW};
      }
    });
  });
  await store.set('exWeights', EXW);

  // avancer automatiquement : prochaine séance non faite
  let nw=SESSION.week, nd=SESSION.day+1;
  while(nw<=8){
    while(nd<4){ if(!CYCLE.dayDone[nw+'-'+nd]) break; nd++; }
    if(nd<4 && !CYCLE.dayDone[nw+'-'+nd]) break;
    nw++; nd=0;
  }
  if(nw<=8){ curWeek=nw; curDay=nd; CYCLE.week=nw; }

  SESSION=null;
  await store.set('session',null);
  await store.set('cycle',CYCLE);
  await store.set('log',LOG);

  // message d'ajustement
  const adjs=Object.entries(CYCLE.lastAdj).filter(([k,a])=>a.week===rec.week && a.delta!==0)
    .map(([k,a])=>`${MAIN[k].label} ${a.delta>0?'+':''}${a.delta}kg`);
  toast(adjs.length?("Ajusté : "+adjs.join(" · ")):"Séance enregistrée 💪");
  go('today');
}
