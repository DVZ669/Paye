<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="BENCH+">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BENCH+">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>BENCH — Spécialisation</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#151922; --panel2:#1d2330; --line:#2a313f;
    --ink:#eef1f6; --dim:#8b93a3; --dimmer:#565d6e;
    --acc:#e8583a; --gold:#f0a83a; --ok:#4ec98a; --steel:#5b8def;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior-y:none}
  body{padding-bottom:96px}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.02em}
  .wrap{max-width:660px;margin:0 auto;padding:0 14px}
  header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0b0d12 72%,rgba(11,13,18,0));padding:16px 0 8px}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:0 14px}
  .brand .mark{font-size:24px;font-weight:900;letter-spacing:-0.04em}
  .brand .mark b{color:var(--acc)}
  .brand .cyc{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:0.12em;text-align:right}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
  .card h2{font-size:19px;margin-bottom:4px}
  .muted{color:var(--dim);font-size:14px}
  .tiny{color:var(--dimmer);font-size:12px}
  label{display:block;font-size:13px;color:var(--dim);font-weight:600;margin:0 0 5px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:16px;font-weight:600}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--acc);color:#fff;border:none;border-radius:11px;padding:14px 18px;font-size:15px;font-weight:800;width:100%}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:9px 12px;font-size:13px}
  .row{display:flex;gap:10px;align-items:center}
  .weeks{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:0 0 auto;min-width:44px;text-align:center;padding:8px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .wk .n{font-weight:900;font-size:16px}
  .wk .p{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.06em;font-weight:700}
  .wk.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .wk.on .p{color:rgba(255,255,255,0.85)}
  .wk.deload.on{background:var(--steel);border-color:var(--steel)}
  .wk.done{opacity:0.5}
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin-top:6px}
  .days::-webkit-scrollbar{display:none}
  .daybtn{flex:0 0 auto;padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--dim)}
  .daybtn.on{background:var(--steel);color:#fff;border-color:var(--steel)}
  .daybtn.ok{border-color:var(--ok)}
  .ex{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
  .ex .top{padding:12px 14px;background:var(--panel2)}
  .namerow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .ex .name{font-weight:800;font-size:15px}
  .ex .meta{font-size:12px;color:var(--dim);margin-top:2px}
  .ex .cue{font-size:11px;color:var(--gold);margin-top:3px;font-weight:600}
  .vid{background:rgba(91,141,239,0.12);border:1px solid rgba(91,141,239,0.4);color:var(--steel);font-size:11px;font-weight:700;border-radius:8px;padding:5px 9px;white-space:nowrap;flex:0 0 auto}
  .rowhead{display:grid;grid-template-columns:38px 1fr 1fr 1fr 44px;gap:8px;padding:6px 14px 2px;font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;text-align:center}
  .rowhead span:first-child{text-align:left}
  .wuhead{padding:8px 14px 2px;font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:0.06em}
  .wusep{padding:8px 14px 2px;font-size:11px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:0.06em;border-top:1px dashed var(--line);margin-top:4px}
  .setrow{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
  .setrow.main{grid-template-columns:38px 1fr 1fr 1fr 44px}
  .setrow.wu{grid-template-columns:38px 1fr 1fr;opacity:0.85}
  .setrow.wu .wuw{font-weight:700;font-size:14px}
  .setrow.wu .wur{font-size:13px;color:var(--dim)}
  .setrow .si{font-weight:800;color:var(--dim);font-size:13px;text-align:center;line-height:1.1}
  .setrow input{padding:9px;text-align:center;font-size:15px}
  .setrow input.rpein{border-color:rgba(240,168,58,0.4);background:rgba(240,168,58,0.06)}
  .chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--dimmer)}
  .chk.done{background:var(--ok);border-color:var(--ok);color:#08130c}
  .rpetag{font-size:11px;color:var(--gold);font-weight:700}
  .rest{position:fixed;left:0;right:0;bottom:78px;z-index:45;display:none;padding:0 14px}
  .rest .inner{max-width:660px;margin:0 auto;background:var(--acc);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
  .rest.show{display:block}
  .rest .t{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
  .rest .lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;opacity:0.85;font-weight:700}
  .rest button{background:rgba(255,255,255,0.2);border:none;color:#fff;font-weight:800;border-radius:9px;padding:8px 12px;font-size:13px;margin-left:8px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(11,13,18,0.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
  nav button{background:none;border:none;color:var(--dimmer);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;text-transform:uppercase;letter-spacing:0.05em}
  nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
  nav button.on{color:var(--acc)}
  .note{background:var(--panel2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--dim);margin:10px 0}
  .note.blue{border-color:var(--steel)}
  .adj{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px}
  .adj.up{background:rgba(78,201,138,0.15);color:var(--ok)}
  .adj.down{background:rgba(232,88,58,0.15);color:var(--acc)}
  .pr{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .pr .n{font-size:24px;font-weight:900;letter-spacing:-0.03em}
  .pr .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.1em;font-weight:700}
  .empty{text-align:center;color:var(--dimmer);padding:30px 10px;font-size:14px}
  .exline{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .exline:first-child{border-top:none}
  .exline .r{color:var(--dim);font-size:13px;flex:0 0 auto;margin-left:10px}
  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ok);color:#08130c;padding:11px 18px;border-radius:999px;font-weight:800;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:88%}
  .toast.show{opacity:1}
  .bar{height:7px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:999px}
  .miss{background:rgba(240,168,58,0.08);border:1px solid rgba(240,168,58,0.3);border-radius:12px;padding:13px 14px;margin:10px 0}
  .misshead{font-weight:800;font-size:14px;color:var(--gold);margin-bottom:3px}
  .misstxt{font-size:13px;color:var(--dim);margin-bottom:10px}
  .hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">BENCH<b>+</b></div>
    <div class="cyc" id="cycInfo">Non démarré</div>
  </div>
</header>
<main class="wrap" id="main"></main>

<div class="rest" id="rest">
  <div class="inner">
    <div><div class="lbl">Repos</div><div class="t" id="restT">3:00</div></div>
    <div class="row"><button onclick="restAdd(30)">+30s</button><button onclick="restStop()">Passer</button></div>
  </div>
</div>

<nav>
  <button data-nav="today" class="on" onclick="go('today')">
    <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="5"/></svg>Séance</button>
  <button data-nav="cycle" onclick="go('cycle')">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>Bloc</button>
  <button data-nav="prs" onclick="go('prs')">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Records</button>
  <button data-nav="history" onclick="go('history')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Journal</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ============ STORAGE ============ */
const store={
  async get(k){try{if(window.storage){const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}}catch(e){}
    try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
  async set(k,v){const s=JSON.stringify(v);try{if(window.storage){await window.storage.set(k,s);}}catch(e){}
    try{localStorage.setItem(k,s);}catch(e){}}
};

/* ============ ÉTAT ============ */
let PR={bench:100, deadlift:180, ohp:60};        // maxs de travail
let PRmax={bench:100, deadlift:180, ohp:60};     // records absolus
let CYCLE=null;
let SESSION=null;
let LOG=[];
let curWeek=1, curDay=0, view='today';

/* ============ PROGRAMME ============
   Spécialisation bench, 4 séances/sem, 6 semaines (S6 = deload).
   J1 Bench lourd  · J2 Deadlift (pas de bench) · J3 Bench volume · J4 Bench technique + renfo pec
   Les séries de travail bench/dead/ohp sont auto-régulées au RPE. */
const DELOAD_WEEK=6;
const RPE_BY_WEEK=[7,7.5,8,8.5,7.5,6];  // S1..S6
// progression : reps baissent, intensité monte (périodisation de force)
const WEEK_PROG=[
  {repsDelta:0, mult:1.00},
  {repsDelta:0, mult:1.03},
  {repsDelta:-1,mult:1.06},
  {repsDelta:-1,mult:1.09},
  {repsDelta:-2,mult:1.13},
  {repsDelta:0, mult:0.80}, // deload
];
function weekReps(base,w){const p=WEEK_PROG[w-1]||WEEK_PROG[0];return Math.max(1,(base||5)+p.repsDelta);}

const DAYS=[
  {name:"J1 · Bench lourd", ex:[
    {lift:"bench", main:true, name:"Développé couché", sets:4, reps:5, targetReps:5, rest:210, cue:"Le mouvement clé. RPE cible de la semaine. Technique stricte, pause à la poitrine."},
    {name:"Développé couché prise serrée", sets:3, reps:"6-8", rest:150, rpeCue:"2 reps en réserve"},
    {name:"Rowing barre", sets:4, reps:"6-8", rest:120, rpeCue:"1-2 reps en réserve"},
    {name:"Développé militaire", sets:3, reps:"8", rest:120, rpeCue:"1-2 reps en réserve"},
    {name:"Extensions triceps poulie", sets:3, reps:"12-15", rest:60, rpeCue:"0-1 rep en réserve (proche échec)"},
  ]},
  {name:"J2 · Deadlift + jambes", ex:[
    {lift:"deadlift", main:true, name:"Soulevé de terre", sets:4, reps:4, targetReps:4, rest:210, cue:"Seul gros mouvement du bas du corps. RPE cible de la semaine."},
    {name:"Squat / Presse à cuisses", sets:4, reps:"6-8", rest:150, rpeCue:"1-2 reps en réserve", leg:true},
    {name:"Soulevé roumain", sets:3, reps:"8-10", rest:120, rpeCue:"1-2 reps en réserve", leg:true},
    {name:"Fentes marchées", sets:3, reps:"10 / jambe", rest:90, rpeCue:"1-2 reps en réserve", leg:true},
    {name:"Leg curl", sets:3, reps:"12-15", rest:75, rpeCue:"0-1 rep en réserve", leg:true},
    {name:"Mollets debout", sets:4, reps:"12-15", rest:60, rpeCue:"0-1 rep en réserve", leg:true},
    {name:"Tractions lestées", sets:3, reps:"6-8", rest:120, rpeCue:"1-2 reps en réserve"},
  ]},
  {name:"J3 · Bench volume", ex:[
    {lift:"bench", main:true, name:"Développé couché", sets:5, reps:6, targetReps:6, rest:180, loadFactor:0.9, cue:"Volume : plus léger que J1, plus de séries. Vitesse et contrôle.", volume:true},
    {name:"Développé incliné haltères", sets:4, reps:"8-10", rest:120, rpeCue:"1-2 reps en réserve"},
    {name:"Tirage horizontal poulie", sets:4, reps:"10-12", rest:90, rpeCue:"1-2 reps en réserve"},
    {name:"Élévations latérales", sets:3, reps:"15", rest:45, rpeCue:"0-1 rep en réserve"},
    {name:"Extensions triceps haltère", sets:3, reps:"12-15", rest:60, rpeCue:"0-1 rep en réserve"},
  ]},
  {name:"J4 · Bench technique + renfo pec", ex:[
    {lift:"bench", main:true, name:"Développé couché (technique)", sets:6, reps:3, targetReps:3, rest:150, loadFactor:0.82, cue:"Léger et explosif : vitesse de barre et technique. Loin de l'échec.", technique:true},
    {name:"Développé couché haltères", sets:4, reps:"8-10", rest:120, rpeCue:"1-2 reps en réserve", pec:true},
    {name:"Écarté poulie / pec deck", sets:4, reps:"12-15", rest:75, rpeCue:"0-1 rep en réserve", pec:true},
    {name:"Pompes lestées", sets:3, reps:"max", rest:75, rpeCue:"proche échec", pec:true},
    {name:"Oiseau (rear delt)", sets:3, reps:"15", rest:45, rpeCue:"0-1 rep en réserve"},
  ]},
];

/* ============ HELPERS ============ */
const roundW=w=>Math.round(w/2.5)*2.5;
function fmtT(s){const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,'0');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}

const START_PCT={bench:0.72, deadlift:0.72, ohp:0.68};
function initCycle(prevNum){
  const loads={};
  ['bench','deadlift','ohp'].forEach(k=>{ loads[k]=roundW(PR[k]*START_PCT[k]); });
  return {start:new Date().toISOString(), num:(prevNum||0)+1, week:1, dayDone:{}, loads, lastAdj:{}, results:{}};
}
function mainLoad(lift, week, loadFactor){
  const p=WEEK_PROG[week-1]||WEEK_PROG[0];
  return roundW(CYCLE.loads[lift]*p.mult*(loadFactor||1));
}
function rpeTarget(week){return RPE_BY_WEEK[week-1];}
function marginText(week){
  const t=rpeTarget(week);const r=Math.round(10-t);
  if(week===DELOAD_WEEK) return "Deload — reste très facile (RPE 6, ~4 reps en réserve). Récupération.";
  return `Gros mouvement : RPE cible ${t} (~${r} rep${r>1?'s':''} en réserve). Accessoires : voir l'indication sous chaque exo.`;
}

/* échauffement calé sur charge de travail + reps de travail */
const WARM_START={bench:40, deadlift:60, ohp:25};
function warmupSets(workW, lift, workReps){
  const bar=20; if(!workW||workW<=bar+10) return [];
  const wr=Math.max(1,parseInt(workReps)||5);
  const out=[];
  if(lift!=='deadlift') out.push({w:bar,r:wr+3,bar:true});
  const start=WARM_START[lift];
  if(start&&start>bar&&start<workW*0.9) out.push({w:roundW(start),r:wr});
  const mids= lift==='deadlift'?[0.65,0.8]:[0.6,0.8];
  const mr=[Math.max(2,Math.ceil(wr/2)), wr<=3?1:2];
  mids.forEach((pp,i)=>{const w=roundW(workW*pp); if(w>bar&&w>out[out.length-1].w&&w<workW*0.92) out.push({w,r:mr[i]});});
  return out;
}
/* e1RM avec correction RPE (RIR = 10 - RPE) */
function e1RM(w,reps,rpe){ const rir=Math.max(0,10-(parseFloat(rpe)||8)); const total=(parseInt(reps)||1)+rir; return Math.round(w*(1+total/30)); }

/* ============ REST ============ */
let restInt=null,restLeft=0;
function restStart(sec){restLeft=sec;const el=document.getElementById('rest');el.classList.add('show');document.getElementById('restT').textContent=fmtT(restLeft);clearInterval(restInt);
  restInt=setInterval(()=>{restLeft--;document.getElementById('restT').textContent=fmtT(Math.max(0,restLeft));if(restLeft<=0){restStop();if(navigator.vibrate)navigator.vibrate([200,80,200]);toast("Repos terminé");}},1000);}
function restAdd(s){restLeft+=s;document.getElementById('restT').textContent=fmtT(restLeft);}
function restStop(){clearInterval(restInt);document.getElementById('rest').classList.remove('show');}

/* ============ NAV ============ */
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));render();window.scrollTo(0,0);}

/* ============ VIDÉO ============ */
function watchExo(name){let q=String(name).split('+')[0].split('/')[0].trim()+" technique musculation";const url="https://www.youtube.com/results?search_query="+encodeURIComponent(q);try{window.open(url,'_blank');}catch(e){location.href=url;}}

/* ============ RENDER ============ */
function render(){
  const m=document.getElementById('main');
  try{
    document.getElementById('cycInfo').textContent = CYCLE?`Bloc ${CYCLE.num} · Sem ${curWeek}/6`:"Non démarré";
    if(!CYCLE){ renderStart(m); return; }
    if(view==='today') renderToday(m);
    else if(view==='cycle') renderCycle(m);
    else if(view==='prs') renderPRs(m);
    else if(view==='prtest') renderPRTest(m);
    else if(view==='history') renderHistory(m);
  }catch(e){ m.innerHTML=`<div class="card"><h2>Souci d'affichage</h2><button class="btn" onclick="repair()">Réparer</button></div>`; console.error(e); }
}
function repair(){SESSION=null;store.set('session',null);view='today';render();}

function renderStart(m){
  m.innerHTML=`<div class="card"><h2>Spécialisation Développé Couché</h2>
    <p class="muted">6 semaines, 4 séances/semaine, focus bench. Trois séances avec du développé couché (lourd, volume, technique) + une séance deadlift pour le bas du corps. Auto-régulé au RPE, avec échauffement et test de max en fin de bloc.</p>
    <div class="note">Le bench utilise de plus petits muscles que le squat/deadlift, il tolère donc une fréquence élevée : bencher 3x/semaine est étayé pour progresser, à condition de varier les intensités (lourd / volume / technique).</div>
    <p class="muted">Vérifie tes records dans l'onglet Records avant de commencer.</p>
    <button class="btn" onclick="startCycle()" style="margin-top:6px">Démarrer le bloc</button></div>`;
}
function startCycle(){CYCLE=initCycle(0);curWeek=1;curDay=0;store.set('cycle',CYCLE);toast("Bloc 1 démarré");render();}

function renderToday(m){
  let wk=`<div class="weeks">`;
  for(let w=1;w<=6;w++){
    const dl=w===DELOAD_WEEK;const done=[0,1,2,3].every(d=>CYCLE.dayDone[w+'-'+d]);
    wk+=`<div class="wk ${w===curWeek?'on':''} ${dl?'deload':''} ${done?'done':''}" onclick="pickWeek(${w})"><div class="n">${w}</div><div class="p">${dl?'deload':weekReps(5,w)+' reps'}</div></div>`;
  }
  wk+=`</div>`;
  let dstrip=`<div class="days">`+DAYS.map((d,i)=>{const done=CYCLE.dayDone[curWeek+'-'+i];return `<button class="daybtn ${i===curDay?'on':''} ${done?'ok':''}" onclick="pickDay(${i})">${done?'✓ ':''}${d.name}</button>`;}).join('')+`</div>`;

  const day=DAYS[curDay];
  const active=SESSION&&SESSION.week===curWeek&&SESSION.day===curDay&&sessionValid(SESSION);
  const alreadyDone=CYCLE.dayDone[curWeek+'-'+curDay]&&!active;
  let body=`<div class="note ${curWeek===DELOAD_WEEK?'blue':''}">${marginText(curWeek)}</div>`;

  body+=day.ex.map((ex,ei)=>{
    const isMain=ex.main;
    const baseLoad=isMain?mainLoad(ex.lift,curWeek,ex.loadFactor):null;
    const tgtRPE=rpeTarget(curWeek);
    const wkReps=isMain?weekReps(ex.targetReps,curWeek):null;
    let head=isMain?`<div class="rowhead"><span></span><span>Charge</span><span>Reps /${wkReps}</span><span>RPE /${tgtRPE}</span><span></span></div>`:'';
    // échauffement
    let warm='';
    if(isMain){
      const wu=warmupSets(baseLoad,ex.lift,wkReps);
      if(wu.length){ warm=`<div class="wuhead">Échauffement <span class="tiny">(non compté)</span></div>`+
        wu.map(w=>`<div class="setrow wu"><div class="si">·</div><div class="wuw">${w.bar?'Barre':w.w+' kg'}</div><div class="wur">${w.r} reps</div><div></div><div></div></div>`).join('')+
        `<div class="wusep">Travail — ${wkReps} reps · RPE ${tgtRPE}</div>`; }
    }
    let sets='';
    for(let s=0;s<ex.sets;s++){
      const sd=active?SESSION.ex[ei].sets[s]:null;
      let sugg=baseLoad;
      if(active&&isMain&&s>0){const prev=SESSION.ex[ei].sets[s-1];
        if(prev.rpe!=null&&prev.rpe!==''){const pw=parseFloat(prev.w)||baseLoad;sugg=suggestNextLoad(pw,tgtRPE,parseFloat(prev.rpe),wkReps||5,parseFloat(prev.r)||null);}
        else sugg=parseFloat(prev.w)||baseLoad;}
      let wVal;
      if(isMain&&active&&s>0&&sd&&!sd.wEdited){wVal=sugg!==null?sugg:'';if(sd.w!==String(wVal))sd.w=String(wVal);}
      else wVal=sd&&sd.w!==''?sd.w:(sugg!==null?sugg:'');
      let rVal;
      if(isMain&&active&&sd&&!sd.rEdited&&wkReps){rVal=String(wkReps);if(sd.r!==rVal)sd.r=rVal;}
      else rVal=sd&&sd.r!==''?sd.r:'';
      const rpeVal=sd&&sd.rpe!=null&&sd.rpe!==''?sd.rpe:'';
      const done=sd&&sd.done;
      let flag='';
      if(active&&isMain&&s>0){const prev=SESSION.ex[ei].sets[s-1];if(prev.rpe!=null&&prev.rpe!==''){const pw=parseFloat(prev.w)||baseLoad;const d=(parseFloat(wVal)||sugg)-pw;if(d>0)flag=`<span class="adj up">+${d}</span>`;else if(d<0)flag=`<span class="adj down">${d}</span>`;}}
      if(isMain){
        sets+=`<div class="setrow main"><div class="si">${s+1}${flag}</div>
          <div><input inputmode="decimal" placeholder="kg" value="${wVal}" onchange="setVal(${ei},${s},'w',this.value)" ${active?'':'disabled'}></div>
          <div><input inputmode="numeric" placeholder="reps" value="${rVal}" onchange="setVal(${ei},${s},'r',this.value)" ${active?'':'disabled'}></div>
          <div><input inputmode="decimal" placeholder="rpe" value="${rpeVal}" onchange="setRPE(${ei},${s},this.value)" ${active?'':'disabled'} class="rpein"></div>
          <div class="chk ${done?'done':''}" onclick="${active?`toggleSet(${ei},${s},${ex.rest||90})`:''}">${done?'✓':''}</div></div>`;
      }else{
        sets+=`<div class="setrow"><div class="si">${s+1}</div>
          <div><input inputmode="decimal" placeholder="kg" value="${sd?sd.w:''}" onchange="setVal(${ei},${s},'w',this.value)" ${active?'':'disabled'}></div>
          <div><input inputmode="numeric" placeholder="reps" value="${sd?sd.r:''}" onchange="setVal(${ei},${s},'r',this.value)" ${active?'':'disabled'}></div>
          <div class="chk ${done?'done':''}" onclick="${active?`toggleSet(${ei},${s},${ex.rest||90})`:''}">${done?'✓':''}</div></div>`;
      }
    }
    const name=isMain?ex.name:ex.name;
    const cue = ex.cue?`<div class="cue">${ex.cue}</div>`:(ex.rpeCue?`<div class="cue">Intensité : ${ex.rpeCue}</div>`:'');
    return `<div class="ex"><div class="top">
      <div class="namerow"><div class="name">${name}</div>
        <button class="vid" onclick="watchExo('${name.replace(/'/g,"\\'")}')">▶ vidéo</button></div>
      <div class="meta">${ex.sets} × ${isMain?wkReps:ex.reps} · repos ${ex.rest?Math.round(ex.rest/60*10)/10+' min':'—'}${isMain?` · départ ${baseLoad} kg`:''}</div>
      ${cue}</div>${head}${warm}${sets}</div>`;
  }).join('');

  if(active){
    body+=`<div class="row" style="margin-top:12px"><button class="btn ghost" onclick="cancelSession()">Annuler</button><button class="btn" onclick="finishSession()">Terminer & ajuster</button></div>`;
  }else if(alreadyDone){
    body+=`<div class="note blue">Séance déjà validée.</div><button class="btn ghost" onclick="startSession()" style="margin-top:4px">Refaire</button>`;
  }else{
    body+=`<button class="btn" onclick="startSession()" style="margin-top:12px">Démarrer cette séance</button>`;
  }

  // fin de bloc -> test PR
  const w6done=[0,1,2,3].every(d=>CYCLE.dayDone[DELOAD_WEEK+'-'+d]);
  if(w6done&&!CYCLE.prTested){
    body+=`<div class="miss" style="border-color:rgba(78,201,138,0.4);background:rgba(78,201,138,0.08)"><div class="misshead" style="color:var(--ok)">Bloc terminé — teste ton max</div><div class="misstxt">Place au test de max bench et deadlift.</div><button class="btn" onclick="go('prtest')">Séance de test PR</button></div>`;
  }
  m.innerHTML=wk+dstrip+body;
}
function pickWeek(w){curWeek=w;render();}
function pickDay(i){curDay=i;render();}

function sessionValid(ses){
  if(!ses||typeof ses.day!=='number'||!Array.isArray(ses.ex))return false;
  const day=DAYS[ses.day];if(!day||ses.ex.length!==day.ex.length)return false;
  for(let i=0;i<day.ex.length;i++){if(!ses.ex[i]||!Array.isArray(ses.ex[i].sets)||ses.ex[i].sets.length!==day.ex[i].sets)return false;}
  return true;
}
function startSession(){
  const day=DAYS[curDay];
  SESSION={week:curWeek,day:curDay,name:day.name,ex:day.ex.map((ex)=>({name:ex.name,lift:ex.lift||null,main:!!ex.main,targetReps:ex.targetReps||null,
    sets:Array.from({length:ex.sets},(_,s)=>{const load=ex.main?mainLoad(ex.lift,curWeek,ex.loadFactor):null;return {w:load!==null?String(load):'',r:'',rpe:'',done:false};})}))};
  store.set('session',SESSION);render();
}
function setVal(ei,s,f,v){if(!SESSION)return;SESSION.ex[ei].sets[s][f]=v;if(f==='w')SESSION.ex[ei].sets[s].wEdited=true;if(f==='r')SESSION.ex[ei].sets[s].rEdited=true;store.set('session',SESSION);render();}
function setRPE(ei,s,v){if(!SESSION)return;SESSION.ex[ei].sets[s].rpe=v;store.set('session',SESSION);render();}
function toggleSet(ei,s,rest){if(!SESSION)return;const d=SESSION.ex[ei].sets[s];d.done=!d.done;store.set('session',SESSION);if(d.done&&rest)restStart(rest);render();}
function cancelSession(){if(confirm("Annuler la séance ?")){SESSION=null;store.set('session',null);restStop();render();}}

function suggestNextLoad(curW,tRPE,aRPE,tReps,aReps){if(aRPE==null)return curW;let g=(tRPE-aRPE)*0.03+((aReps!=null?aReps-tReps:0))*0.03;g=Math.max(-0.07,Math.min(0.07,g));return roundW(curW*(1+g));}

function captureLiftResult(e,week){
  if(!e.main||!e.lift)return;
  let best=null;
  e.sets.forEach(s=>{const w=parseFloat(s.w),r=parseInt(s.r),rpe=parseFloat(s.rpe);if(w>0&&r>0){const est=e1RM(w,r,isNaN(rpe)?8:rpe);if(!best||est>best.est)best={w,r,rpe:isNaN(rpe)?null:rpe,est};}});
  if(best){ if(!CYCLE.results)CYCLE.results={}; CYCLE.results[e.lift]={week,...best}; }
}
function updateLiftFromSession(e,week){
  captureLiftResult(e,week);
  if(week===DELOAD_WEEK)return;
  const target=rpeTarget(week);
  let last=null,lastReps=null,lastW=null;
  e.sets.forEach(s=>{if(s.rpe!=null&&s.rpe!==''){last=parseFloat(s.rpe);lastReps=parseFloat(s.r)||null;lastW=parseFloat(s.w)||null;}});
  if(last==null)return;
  const p=WEEK_PROG[week-1]||WEEK_PROG[0];
  const tReps=weekReps(e.targetReps||5,week);
  const actual=lastW||(CYCLE.loads[e.lift]*p.mult);
  const nextBase=roundW(suggestNextLoad(actual,target,last,tReps,lastReps)/(p.mult||1));
  const before=CYCLE.loads[e.lift];
  CYCLE.loads[e.lift]=nextBase;
  CYCLE.lastAdj[e.lift]={delta:nextBase-before,week};
}
async function finishSession(){
  if(!SESSION)return;
  SESSION.ex.forEach(e=>{if(e.main&&e.lift)updateLiftFromSession(e,SESSION.week);});
  CYCLE.dayDone[SESSION.week+'-'+SESSION.day]=true;
  LOG.unshift({date:new Date().toISOString(),week:SESSION.week,name:SESSION.name,ex:SESSION.ex.map(e=>({name:e.name,main:e.main,sets:e.sets.filter(s=>s.done||s.w||s.r)}))});
  // avancer
  let nw=SESSION.week,nd=SESSION.day+1;
  while(nw<=6){while(nd<4){if(!CYCLE.dayDone[nw+'-'+nd])break;nd++;}if(nd<4&&!CYCLE.dayDone[nw+'-'+nd])break;nw++;nd=0;}
  if(nw<=6){curWeek=nw;curDay=nd;CYCLE.week=nw;}
  SESSION=null;await store.set('session',null);await store.set('cycle',CYCLE);await store.set('log',LOG);
  const a=CYCLE.lastAdj;const parts=Object.keys(a).filter(k=>a[k].week===LOG[0].week&&a[k].delta!==0).map(k=>lab(k)+' '+(a[k].delta>0?'+':'')+a[k].delta+'kg');
  toast(parts.length?("Ajusté : "+parts.join(' · ')):"Séance enregistrée");
  go('today');
}
function lab(k){return k==='bench'?'Couché':k==='deadlift'?'Terre':'Militaire';}

function renderCycle(m){
  const done=Object.values(CYCLE.dayDone).filter(Boolean).length;const pct=Math.round(done/24*100);
  m.innerHTML=`<div class="card"><h2>Progression du bloc</h2><p class="muted">${done}/24 séances · ${pct}%</p><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">Charges de travail (base sem.1)</h3>
    <div class="grid3"><div class="pr"><div class="n">${CYCLE.loads.bench}</div><div class="l">Couché</div></div><div class="pr"><div class="n">${CYCLE.loads.deadlift}</div><div class="l">Terre</div></div><div class="pr"><div class="n">${CYCLE.loads.ohp}</div><div class="l">Militaire</div></div></div>
    <p class="tiny" style="margin-top:10px">Ces bases évoluent selon ton RPE. Chaque semaine, les reps baissent et la charge monte automatiquement par-dessus.</p></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:6px">Structure hebdo</h3>
    <div class="exline"><span>J1</span><span class="r">Bench lourd + triceps/dos/épaules</span></div>
    <div class="exline"><span>J2</span><span class="r">Deadlift + jambes complètes (pas de bench)</span></div>
    <div class="exline"><span>J3</span><span class="r">Bench volume + incliné/dos</span></div>
    <div class="exline"><span>J4</span><span class="r">Bench technique + renfo pec</span></div>
    <div class="exline"><span>Sem. 1→5</span><span class="r">reps ↓, charge ↑ (5→3)</span></div>
    <div class="exline"><span>Sem. 6</span><span class="r">deload puis test max</span></div></div>
    <div class="card"><button class="btn ghost" onclick="nextCycle()">Démarrer un nouveau bloc</button></div>`;
}
function nextCycle(){if(confirm("Nouveau bloc ? Repart de tes records actuels. (historique conservé)")){CYCLE=initCycle(CYCLE.num);curWeek=1;curDay=0;SESSION=null;store.set('cycle',CYCLE);store.set('session',null);toast("Bloc "+CYCLE.num);go('today');}}

/* ===== TEST PR ===== */
const LIFT_BASEREPS={bench:5,deadlift:4};
function estMax(lift){ if(CYCLE.results&&CYCLE.results[lift]) return CYCLE.results[lift].est; return PR[lift]; }
function prAttempts(target,lift){const bar=20;const steps=[0.4,0.6,0.75,0.85,0.93,1.0];const reps=[5,3,2,1,1,1];const out=[];if(lift!=='deadlift')out.push({w:bar,r:6,bar:true});steps.forEach((p,i)=>{const w=roundW(target*p);if(w>bar&&(out.length===0||w>out[out.length-1].w))out.push({w,r:reps[i],attempt:p>=0.9});});return out;}
function renderPRTest(m){
  if(!CYCLE.prTest)CYCLE.prTest={bench:{hit:''},deadlift:{hit:''}};
  const lifts=[['bench','Développé couché'],['deadlift','Soulevé de terre']];
  let h=`<div class="card"><h2>Test des maxs</h2><p class="muted">La cible vient de ta meilleure perf du bloc (charge × reps × RPE réels). Fais tes essais, note la charge max réussie, puis valide.</p></div>`;
  lifts.forEach(([k,label])=>{
    const target=estMax(k);const r=CYCLE.results&&CYCLE.results[k];
    const att=prAttempts(target,k);
    h+=`<div class="card"><h3 style="font-size:16px;margin-bottom:2px">${label}</h3>
      <div class="muted" style="font-size:12px;margin-bottom:8px">Cible estimée : <b>${target} kg</b> · record : ${PRmax[k]} kg${r?` · d'après S${r.week} ${r.w}×${r.r}${r.rpe?' @RPE'+r.rpe:''}`:''}</div>
      <div class="wuhead">Montée vers le max <span class="tiny">(non compté)</span></div>
      ${att.map(a=>`<div class="setrow wu"><div class="si">${a.attempt?'🎯':'·'}</div><div class="wuw">${a.bar?'Barre':a.w+' kg'}</div><div class="wur">${a.r} rep${a.r>1?'s':''}${a.attempt?' (essai)':''}</div><div></div><div></div></div>`).join('')}
      <div style="margin-top:10px"><label>Charge max réussie (kg)</label><input inputmode="decimal" value="${CYCLE.prTest[k].hit}" onchange="setHit('${k}',this.value)" placeholder="${target}"></div></div>`;
  });
  h+=`<div class="card"><button class="btn" onclick="validateTest()">Valider & mettre à jour mes maxs</button>
    <p class="tiny" style="margin-top:8px">Ton max de travail passe à la valeur testée (il pilote les charges). Un record absolu n'est relevé que si tu le bats, jamais baissé.</p></div>`;
  m.innerHTML=h;
}
function setHit(k,v){CYCLE.prTest[k].hit=v;store.set('cycle',CYCLE);}
function validateTest(){
  const res=[];
  ['bench','deadlift'].forEach(k=>{const hit=parseFloat(CYCLE.prTest[k].hit);if(!hit||hit<=0)return;PR[k]=hit;if(hit>PRmax[k]){PRmax[k]=hit;res.push(lab(k)+' ⭐'+hit);}else res.push(lab(k)+' '+hit);});
  store.set('pr',PR);store.set('prmax',PRmax);CYCLE.prTested=true;store.set('cycle',CYCLE);
  toast(res.length?("Maxs mis à jour : "+res.join(' · ')):"Aucune valeur");go('prs');
}

function renderPRs(m){
  m.innerHTML=`<div class="card"><h2>Maxs de travail (1RM)</h2><p class="muted">Pilotent les charges. Mis à jour au test de fin de bloc ; peuvent baisser si tu perds en forme.</p>
    <div class="grid3" style="margin:14px 0"><div class="pr"><div class="n">${PR.bench}</div><div class="l">Couché</div></div><div class="pr"><div class="n">${PR.deadlift}</div><div class="l">Terre</div></div><div class="pr"><div class="n">${PR.ohp}</div><div class="l">Militaire</div></div></div>
    <div class="grid3"><div><label>Couché</label><input inputmode="decimal" id="prb" value="${PR.bench}"></div><div><label>Terre</label><input inputmode="decimal" id="prd" value="${PR.deadlift}"></div><div><label>Militaire</label><input inputmode="decimal" id="pro" value="${PR.ohp}"></div></div>
    <button class="btn" style="margin-top:12px" onclick="savePR()">Enregistrer</button></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:6px">🏆 Records absolus</h3><p class="muted" style="margin-bottom:10px">Tes meilleurs maxs. Ne baissent jamais automatiquement.</p>
    <div class="grid3"><div class="pr" style="border-color:rgba(240,168,58,0.4)"><div class="n">${PRmax.bench}</div><div class="l">Couché</div></div><div class="pr" style="border-color:rgba(240,168,58,0.4)"><div class="n">${PRmax.deadlift}</div><div class="l">Terre</div></div><div class="pr" style="border-color:rgba(240,168,58,0.4)"><div class="n">${PRmax.ohp}</div><div class="l">Militaire</div></div></div></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:6px">Estimer un 1RM</h3><div class="grid2"><div><label>Poids</label><input inputmode="decimal" id="e1" oninput="estim()"></div><div><label>Reps</label><input inputmode="numeric" id="e2" oninput="estim()"></div></div><div id="eo" class="pr" style="margin-top:12px;display:none"><div class="n" id="en">—</div><div class="l">1RM estimé</div></div></div>`;
}
function savePR(){PR.bench=parseFloat(document.getElementById('prb').value)||PR.bench;PR.deadlift=parseFloat(document.getElementById('prd').value)||PR.deadlift;PR.ohp=parseFloat(document.getElementById('pro').value)||PR.ohp;['bench','deadlift','ohp'].forEach(k=>{if(PR[k]>PRmax[k])PRmax[k]=PR[k];});store.set('pr',PR);store.set('prmax',PRmax);toast("Enregistré");render();}
function estim(){const w=parseFloat(document.getElementById('e1').value),r=parseInt(document.getElementById('e2').value);const o=document.getElementById('eo');if(w>0&&r>0){o.style.display='block';document.getElementById('en').textContent=Math.round(w*(1+r/30))+' kg';}else o.style.display='none';}

function renderHistory(m){
  if(!LOG.length){m.innerHTML=`<div class="card"><div class="empty">Aucune séance enregistrée.</div></div>`;return;}
  m.innerHTML=`<div class="card"><h2>Journal</h2><p class="muted">${LOG.length} séance${LOG.length>1?'s':''}.</p></div>`+
    LOG.map((s,i)=>{const dt=new Date(s.date||Date.now());const dstr=dt.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+' · '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      const exs=Array.isArray(s.ex)?s.ex:[];
      const lines=exs.filter(e=>e&&Array.isArray(e.sets)&&e.sets.length).map(e=>{const best=e.sets.reduce((a,b)=>{const wa=parseFloat(a.w)||0,wb=parseFloat(b.w)||0;return wb>wa?b:a;},{w:0});const rpes=e.sets.map(x=>parseFloat(x.rpe)).filter(x=>!isNaN(x));const rt=e.main&&rpes.length?` <span class="tiny">RPE ${(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1)}</span>`:'';return `<div class="exline"><span>${e.name||'Exo'}${rt}</span><span class="r">${e.sets.length}× · ${best.w||'—'}kg</span></div>`;}).join('');
      return `<div class="card"><div class="row" style="justify-content:space-between"><div><div style="font-weight:800">${s.name||'Séance'}</div><div class="muted" style="font-size:12px">Sem ${s.week||'—'} · ${dstr}</div></div><button class="btn ghost sm" style="width:auto" onclick="delLog(${i})">Suppr.</button></div><div style="margin-top:8px">${lines}</div></div>`;
    }).join('');
}
async function delLog(i){if(!confirm("Supprimer ?"))return;LOG.splice(i,1);await store.set('log',LOG);renderHistory(document.getElementById('main'));}

/* ============ INIT ============ */
(async function(){
  const pr=await store.get('pr');if(pr)PR=pr;
  const prm=await store.get('prmax');if(prm)PRmax=prm;else{PRmax={...PR};store.set('prmax',PRmax);}
  ['bench','deadlift','ohp'].forEach(k=>{if(PR[k]>PRmax[k])PRmax[k]=PR[k];});
  const cy=await store.get('cycle');if(cy){CYCLE=cy;curWeek=cy.week||1;if(!CYCLE.results)CYCLE.results={};}
  const log=await store.get('log');if(log)LOG=log;
  const ses=await store.get('session');if(ses&&sessionValid(ses)){SESSION=ses;curWeek=ses.week;curDay=ses.day;}else if(ses){await store.set('session',null);}
  render();
})();
</script>

/* Service worker : rend l'app installable et 100% hors-ligne sur Android/Samsung. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
