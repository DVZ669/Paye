function renderNext(m){
  const curNum=(CYCLE&&CYCLE.num)?CYCLE.num:1;
  const nextNum=curNum+1;
  let h=`<div class="card"><h2>Cycle ${nextNum} (à venir)</h2>
    <p class="muted">Voici les exercices prévus pour ton prochain cycle. Les gros mouvements ne changent pas. Pour chaque accessoire, tu peux choisir la variante que tu feras — pratique si tu sais déjà que tu n'auras pas le matériel.</p></div>`;

  DAYS.forEach((day,di)=>{
    h+=`<div class="card"><h3 style="font-size:15px;margin-bottom:8px">${day.name}</h3>`;
    day.ex.forEach(ex=>{
      if(!ex.slot){
        h+=`<div class="exline"><span>${ex.name}</span><span class="r">${ex.sets}×${ex.reps}</span></div>`;
      }else{
        const rez=resolveExo(ex, di, 'next');
        const opts=rez.list.map((name,idx)=>`<option value="${idx}" ${idx===rez.idx?'selected':''}>${name}</option>`).join('');
        h+=`<div class="nextrow">
          <div class="nextsel"><select onchange="setNextExo(${di},'${ex.slot}',parseInt(this.value))">${opts}</select></div>
          <span class="r">${ex.sets}×${ex.reps}</span>
        </div>`;
      }
    });
    h+=`</div>`;
  });

  const doneCount=Object.values(CYCLE.dayDone).filter(Boolean).length;
  const allDone=doneCount>=32;
  h+=`<div class="card">
    ${allDone?`<div class="note">Ton cycle actuel est terminé. Tu peux basculer sur le cycle ${nextNum}.</div>`:`<div class="note blue">Tu peux basculer dès maintenant, mais ton cycle ${curNum} n'est pas fini (${doneCount}/32 séances).</div>`}
    <button class="btn" onclick="startNextCycle()">Démarrer le cycle ${nextNum}</button>
    <p class="tiny" style="margin-top:8px">Pense à mettre à jour tes records si tu les as retestés — ils redéfinissent les charges de départ.</p>
  </div>`;
  m.innerHTML=h;
}
function startNextCycle(){
  if(!confirm("Passer au cycle suivant ? Les accessoires basculent sur les variantes prévisualisées et les gros mouvements repartent de tes records. (l'historique est conservé)"))return;
  const prevNum=(CYCLE&&CYCLE.num)?CYCLE.num:1;
  const carry=(CYCLE&&CYCLE.nextOverride)?CYCLE.nextOverride:{};
  CYCLE=initCycle(prevNum, carry);
  curWeek=1; curDay=0; SESSION=null;
  store.set('cycle',CYCLE); store.set('session',null);
  toast("Cycle "+CYCLE.num+" démarré");
  go('today');
}

function renderPRTest(m){
  // état du test dans CYCLE.prTest ; la cible se recale sur la perf réelle tant que rien n'est saisi
  if(!CYCLE.prTest) CYCLE.prTest={ squat:{hit:''}, bench:{hit:''}, deadlift:{hit:''} };
  ['squat','bench','deadlift'].forEach(k=>{
    if(!CYCLE.prTest[k]) CYCLE.prTest[k]={hit:''};
    // recalcule la cible à partir des résultats du cycle (ex. semaine 7)
    CYCLE.prTest[k].target = estimatedMaxFromCycle(k);
  });
  store.set('cycle',CYCLE);
  const lifts=[['squat','Squat'],['bench','Développé couché'],['deadlift','Soulevé de terre']];
  let h=`<div class="card"><h2>Test des maxs — fin de bloc</h2>
    <p class="muted">La cible de chaque mouvement est calculée à partir de ta <b>performance réelle de fin de bloc</b> (surtout la semaine 7 : charge, reps et RPE). Si tu as écrasé tes séries, la cible monte ; si tu as galéré, elle descend. Fais tes essais, note la charge max réussie, puis valide.</p></div>`;

  lifts.forEach(([k,label])=>{
    const t=CYCLE.prTest[k];
    const att=prAttempts(t.target, k);
    // origine de la cible : meilleure série réelle de fin de bloc
    let srcTxt='';
    const res=CYCLE.results&&CYCLE.results[k];
    if(res){
      let src=null, srcWk=null;
      for(const wk of [7,6,5,4,3,2,1]){ if(res[wk]){ src=res[wk]; srcWk=wk; break; } }
      if(src){
        srcTxt=`<div class="note blue" style="font-size:12px;margin:6px 0">D'après ta semaine ${srcWk} : ${src.w} kg × ${src.r}${src.rpe?` @ RPE ${src.rpe}`:''} → 1RM estimé ${src.est} kg.</div>`;
      }
    } else {
      srcTxt=`<div class="tiny" style="margin:4px 0 8px">Estimation planifiée (tu n'as pas encore fait la semaine 7).</div>`;
    }
    const rows=att.map(a=>`<div class="setrow wu">
        <div class="si">${a.attempt?'🎯':'·'}</div>
        <div class="wuw">${a.bar?'Barre':a.w+' kg'}</div>
        <div class="wur">${a.r} rep${a.r>1?'s':''}${a.attempt?' (essai max)':''}</div>
        <div></div><div></div>
      </div>`).join('');
    h+=`<div class="card"><h3 style="font-size:16px;margin-bottom:2px">${label}</h3>
      <div class="muted" style="font-size:12px;margin-bottom:6px">Cible estimée : <b>${t.target} kg</b> · record actuel : ${PRmax[k]} kg</div>
      ${srcTxt}
      <div class="wuhead">Montée vers le max <span class="tiny">(non compté)</span></div>
      ${rows}
      <div style="margin-top:10px"><label>Charge max réussie (kg)</label>
        <input inputmode="decimal" value="${t.hit}" onchange="setPRHit('${k}',this.value)" placeholder="ex. ${t.target}"></div>
    </div>`;
  });

  h+=`<div class="card">
    <button class="btn" onclick="validatePRTest()">Valider le test & mettre à jour mes maxs</button>
    <p class="tiny" style="margin-top:8px">Tes maxs de travail passeront aux valeurs testées (ils pilotent les charges du prochain cycle). Un record absolu n'est relevé que si tu le bats ; il n'est jamais baissé automatiquement.</p>
  </div>`;
  m.innerHTML=h;
}
function setPRHit(k,v){ if(!CYCLE.prTest)return; CYCLE.prTest[k].hit=v; store.set('cycle',CYCLE); }
function validatePRTest(){
  if(!CYCLE.prTest)return;
  const res=[];
  ['squat','bench','deadlift'].forEach(k=>{
    const hit=parseFloat(CYCLE.prTest[k].hit);
    if(!hit||hit<=0) return;
    PR[k]=hit;                          // max de travail = valeur testée
    if(hit>PRmax[k]){ PRmax[k]=hit; res.push(label(k)+' ⭐ '+hit); } // nouveau record absolu
    else res.push(label(k)+' '+hit);
  });
  store.set('pr',PR); store.set('prmax',PRmax);
  CYCLE.prTested=true; store.set('cycle',CYCLE);
  toast(res.length?("Maxs mis à jour : "+res.join(' · ')):"Aucune valeur saisie");
  go('prs');
}
function label(k){ return k==='squat'?'Squat':k==='bench'?'Couché':'Terre'; }

function renderPRs(m){
  m.innerHTML=`<div class="card"><h2>Maxs de travail (1RM)</h2>
    <p class="muted">Ces valeurs pilotent les charges. Elles sont mises à jour après la séance de test en fin de bloc, et peuvent baisser si tu perds en forme.</p>
    <div class="grid3" style="margin:14px 0">
      <div class="pr"><div class="n">${PR.bench}</div><div class="l">Couché</div></div>
      <div class="pr"><div class="n">${PR.deadlift}</div><div class="l">Terre</div></div>
      <div class="pr"><div class="n">${PR.squat}</div><div class="l">Squat</div></div>
    </div>
    <div class="grid3">
      <div><label>Couché</label><input inputmode="decimal" id="prb" value="${PR.bench}"></div>
      <div><label>Terre</label><input inputmode="decimal" id="prd" value="${PR.deadlift}"></div>
      <div><label>Squat</label><input inputmode="decimal" id="prsq" value="${PR.squat}"></div>
    </div>
    <button class="btn" style="margin-top:12px" onclick="savePR()">Enregistrer</button>
  </div>
  <div class="card"><h3 style="font-size:15px;margin-bottom:6px">🏆 Records absolus</h3>
    <p class="muted" style="margin-bottom:10px">Tes meilleurs maxs jamais réalisés. Ils ne baissent jamais tout seuls, même si tes maxs de travail descendent — c'est ta référence historique.</p>
    <div class="grid3">
      <div class="pr" style="border-color:rgba(240,168,58,0.4)"><div class="n">${PRmax.bench}</div><div class="l">Couché</div></div>
      <div class="pr" style="border-color:rgba(240,168,58,0.4)"><div class="n">${PRmax.deadlift}</div><div class="l">Terre</div></div>
      <div class="pr" style="border-color:rgba(240,168,58,0.4)"><div class="n">${PRmax.squat}</div><div class="l">Squat</div></div>
    </div>
  </div>
  <div class="card"><h3 style="font-size:15px;margin-bottom:6px">Estimer un 1RM</h3>
    <p class="muted" style="margin-bottom:10px">Formule d'Epley.</p>
    <div class="grid2"><div><label>Poids (kg)</label><input inputmode="decimal" id="e1" oninput="estim()"></div>
    <div><label>Reps</label><input inputmode="numeric" id="e2" oninput="estim()"></div></div>
    <div id="eo" class="pr" style="margin-top:12px;display:none"><div class="n" id="en">—</div><div class="l">1RM estimé</div></div>
  </div>`;
}
function savePR(){
  PR.bench=parseFloat(document.getElementById('prb').value)||PR.bench;
  PR.deadlift=parseFloat(document.getElementById('prd').value)||PR.deadlift;
  PR.squat=parseFloat(document.getElementById('prsq').value)||PR.squat;
  // relève les records absolus s'ils sont battus (jamais baissés ici)
  ['bench','deadlift','squat'].forEach(k=>{ if(PR[k]>PRmax[k]) PRmax[k]=PR[k]; });
  store.set('pr',PR); store.set('prmax',PRmax);
  toast("Maxs enregistrés"); render();
}
function estim(){const w=parseFloat(document.getElementById('e1').value),r=parseInt(document.getElementById('e2').value);
  const o=document.getElementById('eo');if(w>0&&r>0){o.style.display='block';document.getElementById('en').textContent=Math.round(w*(1+r/30))+' kg';}else o.style.display='none';}

function renderHistory(m){
  const testCard=`<div class="card">
    <h3 style="font-size:15px;margin-bottom:6px">Mode essai ${TESTMODE?'<span style="color:var(--gold)">(actif)</span>':''}</h3>
    <p class="muted" style="margin-bottom:10px">${TESTMODE
      ? 'Tu es sur des <b>données de test</b> : ton vrai programme et ton historique sont intacts. Reviens quand tu veux.'
      : 'Teste des modifs sur des <b>données séparées</b>, sans toucher à ton vrai programme ni à ton historique.'}</p>
    <button class="btn ${TESTMODE?'':'ghost'}" onclick="toggleTestMode()">${TESTMODE?'Revenir à mon vrai programme':'Passer en mode essai'}</button>
  </div>`;
  const resetCard=`<div class="card">
    <h3 style="font-size:15px;margin-bottom:6px">Réinitialiser</h3>
    <p class="muted" style="margin-bottom:10px">Efface <b>tout</b> ${TESTMODE?'(données de test)':'(vrai programme)'} : cycle en cours, séance, historique, records et poids mémorisés — et repart de zéro. Action irréversible.</p>
    <button class="btn ghost" onclick="resetAll()">Tout réinitialiser</button>
  </div>`;
  if(!LOG.length){m.innerHTML=`<div class="card"><div class="empty">Aucune séance enregistrée.<br>Termine une séance pour la voir ici.</div></div>`+testCard+resetCard;return;}
  m.innerHTML=`<div class="card"><h2>Historique</h2><p class="muted">${LOG.length} séance${LOG.length>1?'s':''}.</p></div>`+
    LOG.map((s,i)=>{
      const dt=new Date(s.date||Date.now());
      const dstr=dt.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+' · '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      const exs=Array.isArray(s.ex)?s.ex:[];
      const lines=exs.filter(e=>e && Array.isArray(e.sets) && e.sets.length).map(e=>{
        // accessoire multi-mouvement (poids / poids du corps / gainage) : résumé par mouvement
        if(e.movs && e.movs.length){
          const parts=e.movs.map((mov,mi)=>{
            let val='—';
            for(let k=e.sets.length-1;k>=0;k--){ const mm=e.sets[k].m&&e.sets[k].m[mi]; if(!mm)continue;
              if(mov.kind==='hold'){ if(mm.t){ val=mm.t+'s'; break; } }
              else if(mov.kind==='body'){ if(mm.r){ val=mm.r+' reps'; break; } }
              else { if(mm.w){ val=mm.w+'kg'; break; } }
            }
            return e.movs.length>1 ? `${mov.name} ${val}` : val;
          });
          return `<div class="exline"><span>${e.name||'Exercice'}</span><span class="r">${e.sets.length}× · ${parts.join(' / ')}</span></div>`;
        }
        const best=e.sets.reduce((a,b)=>{const wa=parseFloat(a.w)||0,wb=parseFloat(b.w)||0;return wb>wa?b:a;},{w:0});
        const rpes=e.sets.map(x=>parseFloat(x.rpe)).filter(x=>!isNaN(x));
        const rpeTxt=e.main&&rpes.length?` <span class="tiny">RPE ${(rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1)}</span>`:'';
        return `<div class="exline"><span>${e.name||'Exercice'}${rpeTxt}</span><span class="r">${e.sets.length}× · ${best.w||'—'}kg</span></div>`;
      }).join('');
      return `<div class="card"><div class="row" style="justify-content:space-between">
        <div><div style="font-weight:800">${s.name||'Séance'}</div><div class="muted" style="font-size:12px">Semaine ${s.week||'—'} · ${dstr}</div></div>
        <button class="btn ghost sm" style="width:auto" onclick="delLog(${i})">Suppr.</button></div>
        <div style="margin-top:8px">${lines}</div></div>`;
    }).join('')+testCard+resetCard;
}
async function delLog(i){
  if(!confirm("Supprimer cette séance ?"))return;
  LOG.splice(i,1);
  await store.set('log',LOG);
  renderHistory(document.getElementById('main')); // re-render local, robuste
}
// Remet l'app à zéro : efface cycle, séance, historique ET records, puis revient au démarrage.
async function resetAll(){
  const scope = TESTMODE ? "les données de TEST" : "ton programme";
  if(!confirm("Tout réinitialiser ?\n\nCela efface "+scope+" : cycle en cours, séance, historique, records ET poids mémorisés. Action irréversible."))return;
  CYCLE=null; SESSION=null; LOG=[]; EXW={};
  PR={bench:130, deadlift:220, squat:190};
  PRmax={bench:130, deadlift:220, squat:190};
  curWeek=1; curDay=0; equipPicker=null; restStop();
  await store.set('cycle',null);
  await store.set('session',null);
  await store.set('log',null);
  await store.set('exWeights',null);
  await store.set('pr',PR);
  await store.set('prmax',PRmax);
  toast("Tout réinitialisé");
  go('today');
}
// Bascule mode essai <-> vrai programme : recharge tout depuis l'espace de données correspondant.
async function toggleTestMode(){
  const entering=!TESTMODE;
  if(entering && !confirm("Passer en MODE ESSAI ?\n\nTu bascules sur des données de test séparées. Ton vrai programme et ton historique restent intacts — tu reviens quand tu veux."))return;
  TESTMODE=entering;
  await store.set('testmode', TESTMODE);   // clé non préfixée : mémorise le mode
  restStop();
  await loadState();                        // recharge PR / cycle / historique / poids depuis le bon espace
  toast(TESTMODE ? "Mode essai activé 🧪" : "Retour à ton vrai programme");
  go('today');
}

/* ================= INIT ================= */
// Met le cycle en cours à jour avec les listes d'exercices actuelles : retire les
// exercices "fixés" manuellement qui n'existent plus (ils reprennent la rotation).
function migrateCycleExos(C){
  if(!C || !C.slotCustom) return;
  for(const key in C.slotCustom){
    const i=key.indexOf(':'); const di=+key.slice(0,i), slot=key.slice(i+1);
    const day=DAYS[di]; const ex=day && day.ex.find(e=>e.slot===slot);
    const list=ex && ex.alt;
    if(!list || !list.includes(C.slotCustom[key])) delete C.slotCustom[key];
  }
}
// Charge tout l'état depuis l'espace de données courant (réel ou test) puis rend l'écran.
async function loadState(){
  PR={bench:130, deadlift:220, squat:190};
  PRmax={bench:130, deadlift:220, squat:190};
  CYCLE=null; SESSION=null; LOG=[]; EXW={}; curWeek=1; curDay=0;
  const pr=await store.get('pr'); if(pr)PR=pr;
  const prm=await store.get('prmax'); if(prm)PRmax=prm; else { PRmax={...PR}; store.set('prmax',PRmax); }
  // garantit que les records absolus ne sont jamais < aux maxs de travail connus
  ['bench','deadlift','squat'].forEach(k=>{ if(PR[k]>PRmax[k]) PRmax[k]=PR[k]; });
  const cy=await store.get('cycle'); if(cy){CYCLE=cy;curWeek=cy.week||1; if(!CYCLE.num)CYCLE.num=1; if(!CYCLE.nextOverride)CYCLE.nextOverride={}; if(!CYCLE.slotOverride)CYCLE.slotOverride={}; if(!CYCLE.slotCustom)CYCLE.slotCustom={}; if(!CYCLE.equip)CYCLE.equip={}; migrateCycleExos(CYCLE); store.set('cycle',CYCLE);}
  const exw=await store.get('exWeights'); EXW = exw || {};
  const log=await store.get('log'); if(log)LOG=log;
  backfillEXWfromLog();                 // récupère les poids manquants depuis l'historique
  await store.set('exWeights', EXW);
  const ses=await store.get('session'); if(ses && sessionValid(ses)){SESSION=ses;curWeek=ses.week;curDay=ses.day;} else if(ses){ await store.set('session',null); }
  render();
}
// Reconstruit la mémoire des poids à partir des séances déjà enregistrées (Journal),
// pour les exos dont le poids n'est pas encore mémorisé. Gère l'ancien format (séries
// plates {w}) et le nouveau (par mouvement {m:[...]}). Les plus récentes priment.
function backfillEXWfromLog(){
  if(!Array.isArray(LOG)) return;
  for(const rec of LOG){                // LOG = du plus récent au plus ancien
    const exs = Array.isArray(rec.ex) ? rec.ex : [];
    exs.forEach(e=>{
      if(e.main) return;
      const sets = Array.isArray(e.sets) ? e.sets : [];
      if(e.movs && e.movs.length){       // nouveau format (par mouvement)
        e.movs.forEach((mov,mi)=>{
          if(EXW[mov.name]) return;
          for(let k=sets.length-1;k>=0;k--){ const mm=sets[k].m && sets[k].m[mi]; if(!mm) continue;
            if(mov.kind==='hold'){ const t=parseFloat(mm.t); if(!isNaN(t)&&t>0){ EXW[mov.name]={t}; break; } }
            else if(mov.kind==='weight'){ const w=parseFloat(mm.w); if(!isNaN(w)&&w>0){ EXW[mov.name]={w}; break; } }
          }
        });
      } else if(e.name && !EXW[e.name]){  // ancien format (séries plates)
        for(let k=sets.length-1;k>=0;k--){ const w=parseFloat(sets[k].w); if(!isNaN(w)&&w>0){ EXW[e.name]={w}; break; } }
      }
    });
  }
}

(async function(){
  TESTMODE = (await store.get('testmode'))===true;   // restaure le mode (clé non préfixée)
  await loadState();
  // reprise du minuteur de repos basé sur l'heure réelle (survit à une mise en veille)
  const re=await store.get('restEnd');
  if(re && re>Date.now()){ restEnd=re; const el=document.getElementById('rest'); if(el)el.classList.add('show'); restTick(); clearInterval(restInt); restInt=setInterval(restTick,250); }
  else if(re){ await store.set('restEnd',0); }
  // au retour au premier plan, on recalcule immédiatement le temps de repos restant
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && restEnd) restTick(); });
})();

/* ================= PWA : mode hors-ligne + mise à jour automatique ================= */
if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing) return; refreshing=true; location.reload(); // recharge une fois quand une nouvelle version prend la main
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{ try{reg.update();}catch(e){} }).catch(()=>{});
  });
}
</script>
